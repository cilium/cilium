{{- if and .Values.encryption.enabled (eq .Values.encryption.type "ztunnel") (eq .Values.encryption.ztunnel.ca.type "spire") .Values.authentication.mutual.spire.enabled .Values.authentication.mutual.spire.install.enabled .Values.encryption.ztunnel.spire.useCRD -}}
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ printf "cilium-spire-%s-%s-ztunnel-workloads" (include "cilium.namespace" .) .Release.Name }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.authentication.mutual.spire.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.encryption.ztunnel.spire.className }}
  className: {{ . | quote }}
  {{- end }}
  # Register every pod in namespaces enrolled with io.cilium/mtls-enabled=true.
  namespaceSelector:
    matchLabels:
      io.cilium/mtls-enabled: "true"
  # ztunnel requests the SPIFFE ID of the pod's ServiceAccount.
  spiffeIDTemplate: {{ "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}" | quote }}
{{- end }}
