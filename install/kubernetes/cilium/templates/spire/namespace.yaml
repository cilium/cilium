{{- if and (eq (include "ztunnelSpireInstallEnabled" .) "true") (not .Values.encryption.ztunnel.spire.install.existingNamespace) -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.encryption.ztunnel.spire.install.namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.encryption.ztunnel.spire.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
