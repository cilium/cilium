{{- if and .Values.authentication.mutual.spire.enabled .Values.authentication.mutual.spire.install.enabled .Values.encryption.ztunnel.spire.useCRD -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-controller-manager
  namespace: {{ .Values.authentication.mutual.spire.install.namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.authentication.mutual.spire.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  controller-manager.yaml: |
    apiVersion: spire.spiffe.io/v1alpha1
    kind: ControllerManagerConfig
    metrics:
      bindAddress: "0"
    health:
      healthProbeBindAddress: "0.0.0.0:8082"
    leaderElection:
      leaderElect: false
    clusterName: {{ .Values.cluster.name | quote }}
    trustDomain: {{ .Values.authentication.mutual.spire.trustDomain | quote }}
    spireServerSocketPath: /tmp/spire-server/private/api.sock
    {{- with .Values.encryption.ztunnel.spire.className }}
    className: {{ . | quote }}
    {{- end }}
    watchClassless: {{ not .Values.encryption.ztunnel.spire.className }}
    entryIDPrefix: cilium
    reconcile:
      clusterSPIFFEIDs: true
      clusterStaticEntries: true
      clusterFederatedTrustDomains: false
    logLevel: info
{{- end }}
