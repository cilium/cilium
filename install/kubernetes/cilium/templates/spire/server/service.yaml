{{- if eq (include "ztunnelSpireInstallEnabled" .) "true" -}}
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: {{ .Values.encryption.ztunnel.spire.install.namespace }}
  labels:
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.encryption.ztunnel.spire.install.server.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.encryption.ztunnel.spire.install.server.service.annotations .Values.encryption.ztunnel.spire.annotations }}
  annotations:
    {{- with .Values.encryption.ztunnel.spire.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.encryption.ztunnel.spire.install.server.service.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.encryption.ztunnel.spire.install.server.service.type }}
  ports:
  - name: grpc
    port: 8081
    targetPort: grpc
    protocol: TCP
  selector:
    app: spire-server
{{- end }}
