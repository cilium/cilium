{{- if and (eq (include "ztunnelSpireInstallEnabled" .) "true") .Values.encryption.ztunnel.spire.install.agent.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.encryption.ztunnel.spire.install.agent.serviceAccount.name }}
  namespace: {{ .Values.encryption.ztunnel.spire.install.namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.encryption.ztunnel.spire.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
