{{- if and (eq (include "ztunnelSpireInstallEnabled" .) "true") .Values.encryption.ztunnel.spire.install.agent.serviceAccount.create .Values.rbac.create -}}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.encryption.ztunnel.spire.install.agent.serviceAccount.name }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.encryption.ztunnel.spire.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
# Required cluster role to allow spire-agent to query k8s API server
- apiGroups: [ "" ]
  resources: [ "pods","nodes","nodes/proxy" ]
  verbs: [ "get" ]
{{- end }}
