{{- if and .Values.agent .Values.hubble.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hubble-peer
  namespace: {{ include "cilium.namespace" . }}
  {{- with .Values.hubble.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    k8s-app: cilium
    app.kubernetes.io/part-of: cilium
    app.kubernetes.io/name: hubble-peer
    helm.sh/chart: {{ include "cilium.chart" . }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

spec:
  selector:
    k8s-app: cilium
  ports:
  - name: peer-service
    {{- if .Values.hubble.peerService.servicePort }}
    port: {{ .Values.hubble.peerService.servicePort }}
    {{- else }}
    port: {{ .Values.hubble.tls.enabled | ternary 443 80 }}
    {{- end }}
    protocol: TCP
    targetPort: {{ .Values.hubble.peerService.targetPort }}
  internalTrafficPolicy: Local
  {{- if .Values.hubble.peerService.ipFamilyPolicy }}
  ipFamilyPolicy: {{ .Values.hubble.peerService.ipFamilyPolicy }}
  {{- end }}
  {{- if .Values.hubble.peerService.ipFamilies }}
  ipFamilies:
    {{- toYaml .Values.hubble.peerService.ipFamilies | nindent 4 }}
  {{- end }}
{{- end }}
