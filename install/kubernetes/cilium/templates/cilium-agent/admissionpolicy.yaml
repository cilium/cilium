{{- if and .Values.agent (not .Values.preflight.enabled) .Values.rbac.create .Values.rbac.admissionPolicies.agent.create }}
{{- /*
For any permissions granted by the agent's ClusterRole, keep this file in sync with
cilium-preflight/admissionpolicy.yaml
*/ -}}

# Enforce that the cilium agent can only write to
# the Node and CiliumNode on which it is running
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cilium-agent-node-name
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonLabels }}
  labels:
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: {{ include "cilium.chart" . }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["nodes", "nodes/status"]
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ciliumnodes", "ciliumnodes/status"]
  matchConditions:
    # only enforce requests from the relevant service account
    - name: "service-account-name"
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" ( include "cilium.namespace" . )  .Values.serviceAccounts.cilium.name | quote }} {{/* _preflight_diff_ignore_ */}}
  variables:
    # determine token's node name
    - name: userNodeName
      expression: >-
        request.userInfo.extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
  validations:
    # require that the token contains the node name
    - expression: variables.userNodeName != ""
      message: >-
        no node association found for user, this user must run in a pod on a node.
    # require that the object's name match the user's node name
    - expression: variables.userNodeName == request.name
      messageExpression: >-
        "this user running on node '"+variables.userNodeName+"' may not modify Node or CiliumNode '" + request.name +
        "' because the name does not match the node name"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cilium-agent-node-name
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonLabels }}
  labels:
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: {{ include "cilium.chart" . }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyName: cilium-agent-node-name
  validationActions: [Deny]

{{- if.Values.l2announcements.enabled }}
---
# Enforce that the cilium agent can only affect leases
# that start with "cilium-l2announce-"
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cilium-l2announce-lease-name
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonLabels }}
  labels:
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: {{ include "cilium.chart" . }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["leases"]
  matchConditions:
    # only enforce requests from the agent's service account
    - name: cilium-agent-service-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" ( include "cilium.namespace" . )  .Values.serviceAccounts.cilium.name | quote }}
  validations:
    # require that the affected names have the correct prefix
    - expression: "request.name.startsWith('cilium-l2announce-')"
      message: "Cilium agent Lease names must start with 'cilium-l2announce-'."
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cilium-l2announce-lease-name
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonLabels }}
  labels:
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: {{ include "cilium.chart" . }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyName: cilium-l2announce-lease-name
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ include "cilium.namespace" . }}
{{- end }}
{{- end }}
