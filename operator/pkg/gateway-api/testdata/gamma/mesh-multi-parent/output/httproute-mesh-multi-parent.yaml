apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mesh-multi-parent
  namespace: gateway-conformance-mesh
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: echo-v1
      port: 80
    - group: ""
      kind: Service
      name: echo
      port: 80
  rules:
    - backendRefs:
        - name: echo-v1
          port: 80
      filters:
        - responseHeaderModifier:
            set:
              - name: X-Header-Set
                value: v1
          type: ResponseHeaderModifier
status:
  parents:
    - conditions:
        - lastTransitionTime: "2025-06-19T03:21:44Z"
          message: Accepted HTTPRoute
          reason: Accepted
          status: "True"
          type: Accepted
        - lastTransitionTime: "2025-06-19T03:21:44Z"
          message: Service reference is valid
          reason: ResolvedRefs
          status: "True"
          type: ResolvedRefs
      controllerName: io.cilium/gateway-controller
      parentRef:
        group: ""
        kind: Service
        name: echo-v1
        port: 80
