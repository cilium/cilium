apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  creationTimestamp: null
  name: identical-rule-order
  namespace: gateway-conformance-infra
  resourceVersion: "1000"
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - backendRefs:
    - name: infra-backend-v1
      port: 8080
    matches:
    - headers:
      - name: x-version
        value: one
      - name: x-color
        value: blue
      path:
        type: Exact
        value: /same
      queryParams:
      - name: color
        value: green
      - name: animal
        value: whale
  - backendRefs:
    - name: infra-backend-v2
      port: 8080
    matches:
    - headers:
      - name: x-color
        value: blue
      - name: x-version
        value: one
      path:
        type: Exact
        value: /same
      queryParams:
      - name: animal
        value: whale
      - name: color
        value: green
status:
  parents:
  - conditions:
    - lastTransitionTime: "2025-07-01T14:19:43Z"
      message: Accepted HTTPRoute
      reason: Accepted
      status: "True"
      type: Accepted
    - lastTransitionTime: "2025-07-01T14:19:43Z"
      message: Service reference is valid
      reason: ResolvedRefs
      status: "True"
      type: ResolvedRefs
    controllerName: io.cilium/gateway-controller
    parentRef:
      name: same-namespace
