apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-tls-options
  namespace: gateway-conformance-infra
  resourceVersion: "1000"
spec:
  gatewayClassName: cilium
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: one.example.test
      name: tls-12
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: tls-checks-certificate
            namespace: gateway-conformance-infra
        options:
          cilium.io/tls-max-version: "1.3"
          cilium.io/tls-min-version: "1.2"
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: two.example.test
