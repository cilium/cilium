- hostname: '*'
  frontend_tls_validation:
    ca_cert_refs:
      - kind: ConfigMap
        name: first-ca
        namespace: default
    require_client_certificate: true
  name: https
  port: 443
  protocol: HTTPS
  sources:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw
      namespace: default
      version: v1
