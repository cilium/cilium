apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      port: 8443
      protocol: HTTPS
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
            - kind: ConfigMap
              name: default-ca
          mode: AllowValidOnly
      perPort:
        - port: 8443
          tls:
            validation:
              caCertificateRefs:
                - kind: ConfigMap
                  name: per-port-ca
              mode: AllowInsecureFallback
