- hostname: "*"
  name: http
  port: 80
  routes:
  - backends:
    - name: main
      namespace: app-ns
      port:
        port: 8080
    path_match: {}
    request_mirrors:
    - backend:
        name: mirror
        namespace: mirror-ns
        port:
          port: 8081
      denominator: 100
      numerator: 100
    timeout: {}
  sources:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: platform
    namespace: app-ns
    version: v1
