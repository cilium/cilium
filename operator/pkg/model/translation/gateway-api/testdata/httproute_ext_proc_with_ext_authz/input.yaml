# Three routes on the same listener:
#   /api        – ext_proc only          → ext_authz disabled per-route
#   /protected  – ext_authz (GRPC) only  → ext_proc  disabled per-route
#   /public     – neither filter         → both disabled per-route
http:
  - hostname: "*"
    name: prod-web-gw
    port: 80
    routes:
      - backends:
          - TLS: null
            name: api-service
            namespace: default
            port:
              port: 8080
        extension_ref_filters:
          - backend:
              TLS: null
              name: ext-proc-service
              namespace: default
              port:
                port: 4317
            config: Cj0KOwoiZ3JwYzpkZWZhdWx0OmV4dC1wcm9jLXNlcnZpY2U6NDMxNxIVZXh0LXByb2Mtc2VydmljZTo0MzE3QhpjZWVwZi5kZWZhdWx0Lm15X2V4dF9wcm9jLg==
            name: envoy.filters.http.ext_proc/default/my-ext-proc
            type_url: type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
        path_match:
          prefix: /api
        timeout: {}
      - backends:
          - TLS: null
            name: protected-service
            namespace: default
            port:
              port: 8080
        external_auth:
          backend:
            name: auth-service
            namespace: default
            port:
              port: 9001
          protocol: GRPC
        path_match:
          prefix: /protected
        timeout: {}
      - backends:
          - TLS: null
            name: public-service
            namespace: default
            port:
              port: 8080
        path_match:
          prefix: /public
        timeout: {}
    service:
      type: LoadBalancer
      load_balancer_source_ranges_policy: Allow
    sources:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: my-gateway
        namespace: default
        version: v1
