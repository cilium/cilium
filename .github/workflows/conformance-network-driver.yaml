name: Conformance Network Driver (ci-network-driver)

# Any change in triggers needs to be reflected in the concurrency group.
on:
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      UID:
        description: "A second number, to differentiate multiple runs of the same workflow by the same PR"
        required: false
        default: 1
        type: number
      context-ref:
        description: "Context in which the workflow runs. If PR is from a fork, will be the PR target branch (general case). If PR is NOT from a fork, will be the PR branch itself (this allows committers to test changes to workflows directly from PRs)."
        required: true
      SHA:
        description: "SHA under test (head of the PR branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the PR)."
        required: false
      extra-args:
        description: "[JSON object] Arbitrary arguments passed from the trigger comment via regex capture group. Parse with 'fromJson(inputs.extra-args).argName' in workflow."
        required: false
        default: '{}'

  push:
    branches:
      - main
      - ft/main/**
    paths-ignore:
      - 'Documentation/**'
      - 'test/**'

# By specifying the access of one of the scopes, all of those that are not
# specified are set to 'none'.
permissions:
  # To read actions state with cilium/workflow-telemetry-action
  actions: read
  # To be able to access the repository with actions/checkout
  contents: read
  # To allow retrieving information from the PR API
  pull-requests: read
  # To be able to set commit status
  statuses: write
  # To be able to request the JWT from GitHub's OIDC provider
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.PR-number || github.event.after }}
  cancel-in-progress: true

env:
  # Dummy devices published per node. The multi-device scenarios need 2.
  dummy_device_count: 8

jobs:
  echo-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Echo Workflow Dispatch Inputs
    runs-on: ubuntu-26.04
    steps:
      - name: Echo Workflow Dispatch Inputs
        run: |
          echo '${{ tojson(inputs) }}'

  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-26.04
    steps:
      - name: Set initial commit status
        uses: cilium/actions/set-commit-status@687b48a0547e534dd7270d5069a5ab7967c0e907 # main
        with:
          sha: ${{ inputs.SHA || github.sha }}

  installation-and-connectivity:
    name: "Installation and Network Driver Test (${{ matrix.name }})"
    runs-on: ${{ vars.UBUNTU_2604_4CPU_16GB || 'ubuntu-26.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        # The cluster's IP family and the driver's address families match.
        # The disabled family's scenario (ipv4-disabled / ipv6-disabled)
        # runs in the single-stack jobs, dual-stack in the dual-stack job.
        - name: ipv4
          kind-config: .github/kind-config.yaml
          ipv4: "true"
          ipv6: "false"
        - name: ipv6
          kind-config: .github/kind-config-ipv6.yaml
          ipv4: "false"
          ipv6: "true"
        - name: dual-stack
          kind-config: .github/kind-config-dual.yaml
          ipv4: "true"
          ipv6: "true"
    env:
      job_name: "Installation and Network Driver Test (${{ matrix.name }})"
    steps:
      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false

      - name: Checkout code (TRUSTED)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.context-ref || github.sha}}

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Get Cilium's default values
        id: default_vars
        uses: ./.github/actions/helm-default
        with:
          image-tag: ${{ inputs.SHA || github.sha }}
          registry_host: ${{ vars.DOCKER_READ_HOST }}
          registry_organization: ${{ vars.DOCKER_READ_ORG }}
          image-pull-secret: "cilium-registry"
          chart-dir: 'untrusted/install/kubernetes/cilium'

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_K8S_IMAGE }}
          kubectl_version: ${{ env.KIND_K8S_VERSION }}
          config: ${{ matrix.kind-config }}
          wait: 0 # The control-plane never becomes ready, since no CNI is present

      - name: Set up job variables
        id: vars
        run: |
          # The network driver needs DRA (GA in the kind node image) and NRI
          # (enabled in kind's containerd). extraConfig sets the driver's
          # address families, which have no dedicated Helm value.
          CILIUM_INSTALL_DEFAULTS="${{ steps.default_vars.outputs.cilium_install_defaults }} \
            --helm-set=ipv4.enabled=${{ matrix.ipv4 }} \
            --helm-set=ipv6.enabled=${{ matrix.ipv6 }} \
            --helm-set=networkDriver.enabled=true \
            --helm-set-string=extraConfig.enable-network-driver-ipv4=${{ matrix.ipv4 }} \
            --helm-set-string=extraConfig.enable-network-driver-ipv6=${{ matrix.ipv6 }} \
            --wait=false"
          echo cilium_install_defaults=${CILIUM_INSTALL_DEFAULTS} >> $GITHUB_OUTPUT
          echo sha=${{ steps.default_vars.outputs.sha }} >> $GITHUB_OUTPUT

      - name: Install Cilium CLI
        uses: cilium/cilium-cli@1ac7fa66909e3730ab3869c8ba7aa7d68f0197fd # v0.20.2
        with:
          skip-build: ${{ env.CILIUM_CLI_SKIP_BUILD }}
          image-repo: ${{ env.CILIUM_CLI_IMAGE_REPO }}
          image-tag: ${{ steps.vars.outputs.sha }}
          repository: ${{ env.CILIUM_CLI_RELEASE_REPO }}
          release-version: ${{ env.CILIUM_CLI_VERSION }}

      - name: Create imagePullSecret
        if: ${{ vars.DOCKER_AUTH_REQUIRED == 'true' }}
        run: |
          kubectl create secret docker-registry cilium-registry \
            --namespace kube-system \
            --docker-server=${{ vars.DOCKER_READ_HOST }} \
            --docker-username="${{ vars.DOCKER_READ_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_READ_PASSWORD }}"

      - name: Wait for images to be available
        uses: ./.github/actions/wait-for-images
        with:
          SHA: ${{ steps.vars.outputs.sha }}
          images: cilium-ci operator-generic-ci
          login-host: ${{ vars.DOCKER_READ_HOST }}
          login-username: ${{ vars.DOCKER_READ_USERNAME }}
          login-password: ${{ secrets.DOCKER_READ_PASSWORD }}
          auth-required: ${{ vars.DOCKER_AUTH_REQUIRED }}

      # Warning: since this is a privileged workflow, subsequent workflow job
      # steps must take care not to execute untrusted code.
      - name: Checkout pull request branch (NOT TRUSTED)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.sha }}
          persist-credentials: false
          # Required by checkout v7+ to fetch fork PR code; see the NOT TRUSTED warning above.
          allow-unsafe-pr-checkout: true
          path: untrusted
          sparse-checkout: |
            install/kubernetes/cilium

      - name: Install Cilium
        id: install-cilium
        run: |
          cilium install ${{ steps.vars.outputs.cilium_install_defaults }}

      - name: Wait for Cilium status to be ready
        run: |
          cilium status --wait --interactive=false
          kubectl -n kube-system get pods

      # One ClusterConfig per node, each selecting its node by hostname.
      - name: Configure network driver with dummy devices
        run: |
          for node in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
            cat <<EOF | kubectl apply -f -
          apiVersion: cilium.io/v2alpha1
          kind: CiliumNetworkDriverClusterConfig
          metadata:
            name: ci-dummy-${node}
          spec:
            nodeSelector:
              matchLabels:
                kubernetes.io/hostname: ${node}
            spec:
              deviceManagerConfigs:
                dummy:
                  enabled: true
                  count: ${{ env.dummy_device_count }}
              pools:
              - name: ci-dummy
                filter:
                  deviceManagers:
                  - dummy
          EOF
          done

          selected=$(kubectl get nodes --no-headers | wc -l)
          # Wait for the operator to generate a NodeConfig per node.
          for _ in $(seq 1 60); do
            n=$(kubectl get ciliumnetworkdrivernodeconfigs --no-headers 2>/dev/null | wc -l)
            [ "$n" -eq "$selected" ] && break
            sleep 2
          done
          kubectl get ciliumnetworkdrivernodeconfigs
          if [ "$n" -ne "$selected" ]; then
            echo "Expected $selected NodeConfigs, found $n"
            exit 1
          fi

          # confirm that we have devices published as resourceslices.
          want=$(( selected * ${{ env.dummy_device_count }} ))
          for _ in $(seq 1 90); do
            got=$(kubectl get resourceslices -o json \
              | jq '[.items[].spec.devices[]? | select(.attributes["deviceManager"].string == "dummy")] | length')
            [ "$got" -eq "$want" ] && break
            sleep 2
          done
          kubectl get resourceslices -o wide
          if [ "$got" -ne "$want" ]; then
            echo "Expected $want dummy devices in ResourceSlices, found $got"
            exit 1
          fi

      - name: Make JUnit report directory
        run: |
          mkdir -p cilium-junits

      - name: Run network driver connectivity test
        id: run-tests
        run: |
          cilium connectivity test \
            --test network-driver-dummy \
            --test-concurrency 1 \
            --junit-file "cilium-junits/${{ env.job_name }}.xml" \
            --junit-property github_job_step="Run network driver connectivity test"

      - name: Features tested
        if: ${{ always() && steps.install-cilium.outcome == 'success' }}
        uses: ./.github/actions/feature-status
        with:
          title: "Summary of all features tested"
          json-filename: "${{ env.job_name }}"

      - name: Run common post steps
        if: ${{ always() && steps.install-cilium.outcome != 'skipped' }}
        uses: ./.github/actions/post-logic
        with:
          artifacts_suffix: "${{ env.job_name }}"
          job_status: "${{ job.status }}"
          capture_features_tested: false

  merge-upload-and-status:
    name: Merge Upload and Status
    if: ${{ always() }}
    needs: installation-and-connectivity
    uses: ./.github/workflows/common-post-jobs.yaml
    secrets: inherit
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.installation-and-connectivity.result == 'success' }}
