name: Resource Churn Test

on:
  workflow_dispatch:
    inputs:
      test-tag:
        description: "Image tag under test"
        required: true
        type: string
      base-tag:
        description: "Image tag to compare the test tag against. Leave empty to only run the test tag."
        required: false
        type: string
      scenario:
        description: "Churn scenario to run."
        required: false
        default: global-identities-churn
        type: choice
        options:
          - global-identities-churn
          - local-identities-churn
          - policy-identity-churn
          - selectors-churn
          - l7-policy-identity-churn
          - l7-identity-churn

permissions:
  # To be able to trigger eks-cluster-pool-manager.yaml workflow
  actions: write
  # To be able to access the repository with actions/checkout
  contents: read
  # To be able to request the JWT from GitHub's OIDC provider (AWS, GCP)
  id-token: write

concurrency:
  group: |
    ${{ github.workflow }}
    ${{ inputs.base-tag }}
    ${{ inputs.test-tag }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=eksctl-io/eksctl
  eksctl_version: v0.230.0
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubectl_version: v1.36.3
  # renovate: datasource=docker depName=google/cloud-sdk
  gcloud_version: 580.0.0

  test_name: resource-churn

  # EKS Provisioned Control Plane scaling tier, see
  # https://docs.aws.amazon.com/eks/latest/userguide/eks-provisioned-control-plane.html
  control_plane_tier: tier-4xl
  node_instance_type: m5.2xlarge

jobs:
  resource-churn:
    runs-on: ubuntu-24.04
    name: Cilium Resource Churn Test
    timeout-minutes: 150
    env:
      CL2_ENABLE_PVS: "false"
      CL2_PROMETHEUS_PVC_ENABLED: "false"
      CL2_PROMETHEUS_NODE_SELECTOR: 'role.scaffolding/test-infra: "true"'

      # We need node label on metrics, so cilium-agent scraping is managed
      # separately by the additional PodMonitor in the module's monitors/.
      CL2_PROMETHEUS_SCRAPE_CILIUM_OPERATOR: "true"
      CL2_PROMETHEUS_SCRAPE_CILIUM_AGENT: "false"

      CL2_TEST_DURATION_SECONDS: "1200"
      CL2_KFUZZ_TERMINATION_GRACE_PERIOD_SECONDS: "600"
      CL2_ENABLE_VIOLATIONS: "false"
    steps:
      - name: Checkout context ref (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Set up job variables
        id: vars
        env:
          BASE_TAG: ${{ inputs.base-tag }}
          TEST_TAG: ${{ inputs.test-tag }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" == "push" ]; then
            : "${TEST_TAG:=}"
            : "${BASE_TAG:=}"
          fi
          : "${SCENARIO:=test-scenario}"

          RUN_BASELINE=false
          tag_inputs=("${TEST_TAG}")
          if [ -n "${BASE_TAG}" ]; then
            RUN_BASELINE=true
            tag_inputs+=("${BASE_TAG}")
          fi

          for tag_input in "${tag_inputs[@]}"; do
            if [[ ! "${tag_input}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "::error::'${tag_input}' is not a valid image tag"
              exit 1
            fi
          done

          if [ "${BASE_TAG}" == "${TEST_TAG}" ]; then
            echo "::warning::base-tag and test-tag are identical, the comparison will not show anything"
          fi

          if [ ! -f ".github/actions/cl2-modules/resource-churn/scenarios/${SCENARIO}.yaml" ]; then
            echo "::error::Unknown scenario '${SCENARIO}'"
            exit 1
          fi

          OWNER="${{ github.ref_name }}"
          OWNER="${OWNER//[.\/]/-}"

          CLUSTER_NAME="scale-churn-${{ github.run_id }}-${{ github.run_attempt }}"

          eks_version_and_region=$(yq '.include | sort_by(.version) | reverse | .[0] | "\(.version),\(.region)"' .github/actions/eks/k8s-versions.yaml)
          EKS_VERSION=$(echo "$eks_version_and_region" | cut -d',' -f1)
          EKS_REGION=$(echo "$eks_version_and_region" | cut -d',' -f2)

          {
            echo "base_tag=${BASE_TAG}"
            echo "test_tag=${TEST_TAG}"
            echo "base_tag_short=${BASE_TAG:0:12}"
            echo "test_tag_short=${TEST_TAG:0:12}"
            echo "run_baseline=${RUN_BASELINE}"
            echo "scenario=${SCENARIO}"
            echo "owner=${OWNER}"
            echo "cluster_name=${CLUSTER_NAME}"
            echo "eks_version=${EKS_VERSION}"
            echo "eks_region=${EKS_REGION}"
            echo "eks_zone_1=${EKS_REGION}b"
            echo "eks_zone_2=${EKS_REGION}c"
          } >> "$GITHUB_OUTPUT"

          echo "CL2_TEST_SCENARIO=${SCENARIO}" >> "$GITHUB_ENV"
          {
            echo "## Resource churn"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Scenario | \`${SCENARIO}\` |"
            echo "| Test tag | \`${TEST_TAG}\` |"
            if [ "${RUN_BASELINE}" == "true" ]; then
              echo "| Baseline tag | \`${BASE_TAG}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout baseline chart (NOT TRUSTED)
        if: ${{ steps.vars.outputs.run_baseline == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.base_tag }}
          persist-credentials: false
          # Required by checkout v7+ to fetch fork PR code; see the NOT TRUSTED warning above.
          allow-unsafe-pr-checkout: true
          path: untrusted/cilium-baseline
          sparse-checkout: |
            install/kubernetes/cilium

      - name: Checkout test chart (NOT TRUSTED)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.test_tag }}
          persist-credentials: false
          # Required by checkout v7+ to fetch fork PR code; see the NOT TRUSTED warning above.
          allow-unsafe-pr-checkout: true
          path: untrusted/cilium-test
          sparse-checkout: |
            install/kubernetes/cilium

      - name: Wait for baseline Cilium images
        if: ${{ steps.vars.outputs.run_baseline == 'true' }}
        timeout-minutes: 1
        uses: ./.github/actions/wait-for-images
        with:
          SHA: ${{ steps.vars.outputs.base_tag }}
          images: cilium-ci operator-aws-ci
          login-host: ${{ vars.DOCKER_READ_HOST }}
          login-username: ${{ vars.DOCKER_READ_USERNAME }}
          login-password: ${{ secrets.DOCKER_READ_PASSWORD }}
          auth-required: ${{ vars.DOCKER_AUTH_REQUIRED }}

      - name: Wait for test Cilium images
        timeout-minutes: 1
        uses: ./.github/actions/wait-for-images
        with:
          SHA: ${{ steps.vars.outputs.test_tag }}
          images: cilium-ci operator-aws-ci cilium-cli-ci
          login-host: ${{ vars.DOCKER_READ_HOST }}
          login-username: ${{ vars.DOCKER_READ_USERNAME }}
          login-password: ${{ secrets.DOCKER_READ_PASSWORD }}
          auth-required: ${{ vars.DOCKER_AUTH_REQUIRED }}

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.26.5

      - name: Setup gcloud credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_PERF_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PERF_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ secrets.GCP_PERF_PROJECT_ID }}
          version: ${{ env.gcloud_version }}

      - name: Setup tooling
        run: |
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 -O "https://dl.k8s.io/release/${{ env.kubectl_version }}/bin/linux/amd64/kubectl"
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 -O "https://dl.k8s.io/${{ env.kubectl_version }}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -O "https://github.com/eksctl-io/eksctl/releases/download/${{ env.eksctl_version }}/eksctl_$(uname -s)_amd64.tar.gz"
          sudo tar -xzvf "eksctl_$(uname -s)_amd64.tar.gz" -C /usr/bin
          rm "eksctl_$(uname -s)_amd64.tar.gz"

      - name: Set up AWS CLI credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PR_ASSUME_ROLE }}
          aws-region: ${{ steps.vars.outputs.eks_region }}

      - name: Create EKS cluster
        id: deploy-cluster
        uses: ./.github/actions/setup-eks-cluster
        with:
          create-cluster: "true"
          cluster_name: ${{ steps.vars.outputs.cluster_name }}
          region: ${{ steps.vars.outputs.eks_region }}
          zones: "${{ steps.vars.outputs.eks_zone_1 }} ${{ steps.vars.outputs.eks_zone_2 }}"
          owner: "${{ steps.vars.outputs.owner }}"
          version: "${{ steps.vars.outputs.eks_version }}"
          addons: "coredns"
          control_plane_scaling_tier: "${{ env.control_plane_tier }}"

      - name: Generate cilium-cli kubeconfig
        id: gen-kubeconfig
        uses: ./.github/actions/get-cloud-kubeconfig
        with:
          kubeconfig: "~/.kube/config"

      - name: Create imagePullSecret
        if: ${{ vars.DOCKER_AUTH_REQUIRED == 'true' }}
        run: |
          kubectl create secret docker-registry cilium-registry \
            --namespace kube-system \
            --docker-server=${{ vars.DOCKER_READ_HOST }} \
            --docker-username="${{ vars.DOCKER_READ_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_READ_PASSWORD }}"

      - name: Get Cilium values for the baseline installation
        id: baseline_vars
        if: ${{ steps.vars.outputs.run_baseline == 'true' }}
        uses: ./.github/actions/helm-default
        with:
          image-tag: ${{ steps.vars.outputs.base_tag }}
          registry_host: ${{ vars.DOCKER_READ_HOST }}
          registry_organization: ${{ vars.DOCKER_READ_ORG }}
          chart-dir: ./untrusted/cilium-baseline/install/kubernetes/cilium
          image-pull-secret: "cilium-registry"
          debug: "false"

      - name: Get Cilium values for test installation
        id: test_vars
        uses: ./.github/actions/helm-default
        with:
          image-tag: ${{ steps.vars.outputs.test_tag }}
          registry_host: ${{ vars.DOCKER_READ_HOST }}
          registry_organization: ${{ vars.DOCKER_READ_ORG }}
          chart-dir: ./untrusted/cilium-test/install/kubernetes/cilium
          image-pull-secret: "cilium-registry"
          debug: "false"

      - name: Install Cilium CLI
        uses: cilium/cilium-cli@7ca7fc53c20275f5c10ef5f3557076691fd1d720 # v0.19.7
        timeout-minutes: 5
        with:
          skip-build: ${{ env.CILIUM_CLI_SKIP_BUILD }}
          image-repo: ${{ env.CILIUM_CLI_IMAGE_REPO }}
          image-tag: ${{ steps.vars.outputs.test_tag }}
          repository: ${{ env.CILIUM_CLI_RELEASE_REPO }}
          release-version: ${{ env.CILIUM_CLI_VERSION }}
          kubeconfig: ${{ steps.gen-kubeconfig.outputs.kubeconfig_path }}

      - name: Prepare the shared cilium install values
        id: install-values
        run: |
          HELM_VALUES_FILE="cilium-install-helm-values.yaml"
          echo "helm_values_file=${HELM_VALUES_FILE}" >> "$GITHUB_OUTPUT"

          K8S_API_SRV_ADDR=$(kubectl config view -o jsonpath='{.clusters[0].cluster.server}' | sed 's|https://||')
          echo "Retrieved Kubernetes API Server address: '${K8S_API_SRV_ADDR}'"

          cat <<EOF > "${GITHUB_WORKSPACE}/${HELM_VALUES_FILE}"
          k8sServiceHost: "${K8S_API_SRV_ADDR}"
          k8sServicePort: 443
          kubeProxyReplacement: true

          eni:
            enabled: true
          ipam:
            mode: eni
          routingMode: native
          egressMasqueradeInterfaces: eth+

          debug:
            enabled: false
          pprof:
            enabled: true
          prometheus:
            enabled: true
          operator:
            prometheus:
              enabled: true
          healthChecking: false
          bpf:
            policyMapMax: 65536
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: type
                    operator: NotIn
                    values:
                    - kwok
          envoy:
            enabled: true
            debug:
              enabled: false
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: type
                      operator: NotIn
                      values:
                      - kwok
          EOF

      # Installation is required here so that node group creation below doesn't fail.
      - name: Install Cilium
        id: install-cilium
        env:
          RUN_BASELINE: ${{ steps.vars.outputs.run_baseline }}
        run: |
          if [ "${RUN_BASELINE}" == "true" ]; then
            echo "Installing the baseline (${{ steps.vars.outputs.base_tag }})"
            install_defaults="${{ steps.baseline_vars.outputs.cilium_install_defaults }}"
          else
            echo "Installing the test tag (${{ steps.vars.outputs.test_tag }})"
            install_defaults="${{ steps.test_vars.outputs.cilium_install_defaults }}"
          fi

          cilium install ${install_defaults} --helm-values="${{ steps.install-values.outputs.helm_values_file }}"

      - name: Create EKS nodegroups
        uses: ./.github/actions/setup-eks-nodegroup
        with:
          cluster_name: ${{ steps.vars.outputs.cluster_name }}
          region: ${{ steps.vars.outputs.eks_region }}
          owner: "${{ steps.vars.outputs.owner }}"
          version: "${{ steps.vars.outputs.eks_version }}"
          timeout: "15m"
          node_groups_override: |
            managedNodeGroups:
            - name: ng-test-infra
              instanceTypes:
              - ${{ env.node_instance_type }}
              availabilityZones:
              - ${{ steps.vars.outputs.eks_zone_1 }}
              desiredCapacity: 1
              spot: false
              privateNetworking: true
              volumeType: "gp3"
              volumeSize: 20
              maxPodsPerNode: 110
              taints:
              - key: "node.cilium.io/agent-not-ready"
                value: "true"
                effect: "NoExecute"
              labels:
                role.scaffolding/test-infra: "true"

            - name: ng-test-node
              instanceTypes:
              - ${{ env.node_instance_type }}
              availabilityZones:
              - ${{ steps.vars.outputs.eks_zone_1 }}
              desiredCapacity: 1
              spot: false
              privateNetworking: true
              volumeType: "gp3"
              volumeSize: 20
              maxPodsPerNode: 110
              taints:
              - key: "node.cilium.io/agent-not-ready"
                value: "true"
                effect: "NoExecute"
              labels:
                role.scaffolding/test-node: "true"

      - name: Prepare cluster for testing
        id: prepare-cluster
        run: |
          cilium status --wait --interactive=false
          kubectl get nodes -o wide --show-labels

          TEST_NODE_NAME=$(kubectl get nodes -l eks.amazonaws.com/nodegroup=ng-test-node -o jsonpath='{.items[0].metadata.name}')
          TEST_INFRA_NODE_NAME=$(kubectl get nodes -l eks.amazonaws.com/nodegroup=ng-test-infra -o jsonpath='{.items[0].metadata.name}')

          kubectl cordon "${TEST_NODE_NAME}"
          kubectl create namespace kfuzz

          # Create kwok CRDs and Stages
          kubectl apply -k "https://github.com/fristonio/kwok//kustomize/crd?ref=dev/cilium"
          kubectl apply -k "https://github.com/fristonio/kwok//kustomize/stage/fast?ref=dev/cilium"

          echo "test_node_name=${TEST_NODE_NAME}" >> "$GITHUB_OUTPUT"
          echo "test_infra_node_name=${TEST_INFRA_NODE_NAME}" >> "$GITHUB_OUTPUT"

          echo "CL2_TEST_NODE_NAME=${TEST_NODE_NAME}" >> "$GITHUB_ENV"

      - name: Clone ClusterLoader2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubernetes/perf-tests
          # Avoid using renovate to update this dependency because: (1)
          # perf-tests does not tag or release, so renovate will pull
          # all updates to the default branch and (2) continually
          # updating CL2 may impact the stability of the scale test
          # results.
          ref: d51da38a445d653c6f7cd039728d313cb31290b9
          persist-credentials: false
          sparse-checkout: clusterloader2
          path: perf-tests

      - name: Set up the ClusterLoader2 arguments
        id: cl2-setup
        working-directory: ./perf-tests/clusterloader2
        run: |
          module_dir="${GITHUB_WORKSPACE}/.github/actions/cl2-modules/resource-churn"

          echo "PROMETHEUS_SCRAPE_APISERVER_ONLY: true" > ./cl2-test-overrides.yaml
          args=(
            -v=2
            --testconfig="${module_dir}/config.yaml"
            --prometheus-additional-monitors-path="${module_dir}/monitors"
            --testoverrides=./cl2-test-overrides.yaml
            --provider=aws
            --enable-exec-service=false
            --enable-prometheus-server
            --prometheus-scrape-kube-proxy=false
            --prometheus-scrape-kubelets=false
            --experimental-prometheus-snapshot-to-report-dir=true
            --kubeconfig="${HOME}/.kube/config"
            --tear-down-prometheus-server=false
          )

          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
          echo "module_dir=${module_dir}" >> "$GITHUB_OUTPUT"

          echo "CL2-related environment variables"
          printenv | grep CL2_ || true

      - name: Run CL2 against the baseline
        id: run-baseline
        if: ${{ steps.vars.outputs.run_baseline == 'true' }}
        working-directory: ./perf-tests/clusterloader2
        shell: bash
        timeout-minutes: 60
        env:
          CLUSTERLOADER_ARGS: ${{ steps.cl2-setup.outputs.args }}
          REPORT_DIR: ./report/baseline
        run: |
          mkdir -p "${REPORT_DIR}"

          echo "time_start=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          go run ./cmd/clusterloader.go \
            ${CLUSTERLOADER_ARGS} --report-dir="${REPORT_DIR}" \
            2>&1 | tee cl2-output-baseline.txt
          echo "time_end=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

          sudo chmod --recursive +r "${REPORT_DIR}"

          # Ensure no state is left behind from baseline run.
          echo "Cleaning up baseline run created resources"

          kubectl --namespace kfuzz delete deployments --all
          kubectl --namespace kfuzz delete ciliumnetworkpolicies --all
          # CiliumCIDRGroup is cluster-scoped.
          kubectl delete ciliumcidrgroups --all

          kubectl delete namespace kfuzz --wait
          kubectl delete nodes -l type=kwok

          kubectl -n kube-system delete job kfuzz-0 || true
          kubectl -n kube-system delete pod kwok-0 || true

          # Individual identity cleanup is very slow in high scale environment.
          # Cleanup kwok managed identities directly using a raw api request.
          kubectl delete --raw "/apis/cilium.io/v2/ciliumidentities?labelSelector=io.kubernetes.pod.namespace%3Dkwok" > /dev/null || true
          kubectl delete ciliumidentities -l io.kubernetes.pod.namespace=kfuzz --wait=false

          # Everything CL2 creates while setting up its Prometheus stack
          # tolerates AlreadyExists, except this one secret -- without deleting
          # it the second run dies with `secrets "prometheus-token" already
          # exists` instead of reusing the stack (and the TSDB) left running by
          # --tear-down-prometheus-server=false. CL2 mints a fresh token on the
          # next run; the Prometheus pod itself is left alone.
          kubectl --namespace monitoring delete secret prometheus-token --ignore-not-found

      - name: Baseline results heading
        if: ${{ always() && steps.run-baseline.outcome != 'skipped' }}
        run: |
          echo "## Baseline results (\`${{ steps.vars.outputs.base_tag }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish baseline results
        if: ${{ always() && steps.run-baseline.outcome != 'skipped' }}
        uses: ./.github/actions/post-logic
        with:
          artifacts_suffix: "baseline-${{ steps.vars.outputs.scenario }}"
          job_status: "${{ job.status }}"
          junits-directory: 'perf-tests/clusterloader2/report/baseline'
          capture_sysdump: 'false'
          capture_features_tested: 'false'

      - name: Export baseline results to GS bucket
        if: ${{ always() && steps.run-baseline.outcome != 'skipped' && steps.run-baseline.outcome != 'cancelled' }}
        uses: cilium/scale-tests-action/export-results@7e3eae9de9542f1a7616ca797e2d5090e8f9f8ee # main
        with:
          test_name: ${{ env.test_name }}-${{ steps.vars.outputs.scenario }}
          tested_sha: ${{ steps.vars.outputs.base_tag }}
          results_bucket: ${{ env.GCP_PERF_RESULTS_BUCKET }}
          artifacts: ./perf-tests/clusterloader2/report/baseline/
          other_files: ./perf-tests/clusterloader2/cl2-output-baseline.txt

      # Refresh credentials in case they expire while we run baseline.
      - name: Refresh AWS CLI credentials
        if: ${{ steps.vars.outputs.run_baseline == 'true' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PR_ASSUME_ROLE }}
          aws-region: ${{ steps.vars.outputs.eks_region }}

      - name: Switch Cilium to the test tag
        id: install-cilium-test
        if: ${{ steps.vars.outputs.run_baseline == 'true' }}
        env:
          TEST_DEFAULTS: ${{ steps.test_vars.outputs.cilium_install_defaults }}
        run: |
          cilium uninstall
          kubectl --namespace kube-system wait --for=delete pod -l k8s-app=cilium --timeout=2m || true
          sleep 60

          cilium install ${TEST_DEFAULTS} --helm-values="${{ steps.install-values.outputs.helm_values_file }}"
          cilium status --wait --interactive=false

          kubectl create namespace kfuzz
          kubectl --namespace monitoring get pods -o wide

      - name: Run CL2 against the test tag
        id: run-test
        working-directory: ./perf-tests/clusterloader2
        shell: bash
        timeout-minutes: 60
        env:
          CLUSTERLOADER_ARGS: ${{ steps.cl2-setup.outputs.args }}
          REPORT_DIR: ./report/test
        run: |
          mkdir -p "${REPORT_DIR}"

          echo "time_start=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          go run ./cmd/clusterloader.go \
            ${CLUSTERLOADER_ARGS} --report-dir="${REPORT_DIR}" \
            2>&1 | tee cl2-output-test.txt
          echo "time_end=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

          sudo chmod --recursive +r "${REPORT_DIR}"

      - name: Test tag results heading
        if: ${{ always() && steps.run-test.outcome != 'skipped' }}
        run: |
          echo "## Test tag results (\`${{ steps.vars.outputs.test_tag }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test tag results
        if: ${{ always() && steps.run-test.outcome != 'skipped' }}
        uses: ./.github/actions/post-logic
        with:
          artifacts_suffix: "test-${{ steps.vars.outputs.scenario }}"
          job_status: "${{ job.status }}"
          junits-directory: 'perf-tests/clusterloader2/report/test'
          capture_sysdump: 'false'
          capture_features_tested: 'false'

      - name: Export test tag results to GS bucket
        if: ${{ always() && steps.run-test.outcome != 'skipped' && steps.run-test.outcome != 'cancelled' }}
        uses: cilium/scale-tests-action/export-results@7e3eae9de9542f1a7616ca797e2d5090e8f9f8ee # main
        with:
          test_name: ${{ env.test_name }}-${{ steps.vars.outputs.scenario }}
          tested_sha: ${{ steps.vars.outputs.test_tag }}
          results_bucket: ${{ env.GCP_PERF_RESULTS_BUCKET }}
          artifacts: ./perf-tests/clusterloader2/report/test/
          other_files: ./perf-tests/clusterloader2/cl2-output-test.txt

      # Refresh credentials, since the role assumption session from earlier
      # may have expired during the (potentially long-running) test.
      - name: Set up AWS CLI credentials
        if: ${{ always() && steps.deploy-cluster.outcome != 'skipped' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PR_ASSUME_ROLE }}
          aws-region: ${{ steps.vars.outputs.eks_region }}

      - name: Cleanup cluster
        if: ${{ always() && steps.deploy-cluster.outcome != 'skipped' }}
        run: |
          eksctl delete cluster --name ${{ steps.vars.outputs.cluster_name }} --region ${{ steps.vars.outputs.eks_region }}
