name: Renovate
on:
  schedule:
    # Running every hour every working day (Monday to Friday)
    - cron: '0 * * * 1-5'
    # Running every two hours on weekends (Saturday and Sunday)
    - cron: '0 */2 * * 6,0'
  # allow to manually trigger this workflow
  workflow_dispatch:
    inputs:
      renovate_log_level_debug:
        type: boolean
        description: "Run Renovate With Debug Log Levels"
        default: true
      dry_run:
        type: boolean
        description: "Log What Renovate Would Do Without Creating Branches Or PRs"
        default: false

jobs:
  renovate:
    name: Run self-hosted Renovate
    runs-on: ubuntu-24.04
    environment:
      name: renovate
      deployment: false
    permissions:
      contents: read
    steps:
      # we need special permission to be able to operate renovate (view, list,
      # create issues, PR, etc.) and we use a GitHub application with fine
      # grained permissions installed in the repository for that.
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CILIUM_RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.CILIUM_RENOVATE_PEM }}

      # renovate clones the repository again in its container fs but it needs
      # the renovate configuration to start.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        env:
          # default to DEBUG log level, this is always useful
          LOG_LEVEL: ${{ github.event.inputs.renovate_log_level_debug == 'false' && 'INFO' || 'DEBUG' }}
          # an empty value is skipped by Renovate's env parser, so scheduled runs are unaffected
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'lookup' || '' }}
          # /tmp is the only path shared with the Renovate container. The file holds
          # Renovate's own records, which its sanitizer runs over, and not the step's
          # stdout, which echoes the token-bearing docker command line.
          RENOVATE_LOG_FILE: ${{ github.event.inputs.dry_run == 'true' && '/tmp/renovate.log' || '' }}
        with:
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 44.104.0
          docker-user: root
          docker-cmd-file: .github/actions/renovate/entrypoint.sh
          configurationFile: .github/renovate.json5
          token: '${{ steps.get_token.outputs.token }}'
          mount-docker-socket: true

      - name: Summarise the dry run
        if: ${{ always() && github.event.inputs.dry_run == 'true' }}
        env:
          LOG: /tmp/renovate.log
        run: |
          if [ ! -s "${LOG}" ]; then
            echo 'Renovate wrote no log file.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          emit() {
            out=$(grep -oE "$2" "${LOG}" | sort -u || true)
            printf '### %s\n\n' "$1"
            printf '%s\n' "${out:-none}" | sed 's/^/    /'
            printf '\n'
          }
          {
            echo '## Renovate dry run'
            echo
            emit 'Branches it would have created' 'Returning [0-9]+ branch\(es\).*'
            emit 'Updates it found' '[0-9]+ flattened updates found: .*'
            emit 'Vulnerability fixes it found' 'Setting allowed version .* to fix vulnerability .* in .*'
          } >> "${GITHUB_STEP_SUMMARY}"
