name: Image CI Cache Cleaner

# Any change in triggers needs to be reflected in the concurrency group.
on:
  workflow_dispatch:
  schedule:
    # Run the GC every Monday at 6am
    - cron: "0 6 * * 1"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

jobs:
  cache-cleaner:
    name: Clean Image Cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # `actions:write` permission is required to delete caches
      #   See also: https://docs.github.com/en/rest/actions/cache?apiVersion=2022-11-28#delete-a-github-actions-cache-for-a-repository-using-a-cache-id
      actions: write
      contents: read
    steps:
      - name: Clean cache from GitHub
        shell: bash
        run: |
          gh extension install actions/gh-actions-cache

          REPO=${{ github.repository }}
          BRANCH=${{ github.event.repository.default_branch }}
          set +e
          for prefix in ${{ runner.os }}-go- ${{ runner.os }}-ccache-; do
            while true; do
              caches=$(gh actions-cache list -R $REPO --key ${prefix} -B ${BRANCH} -L 100 | awk '{ print $1 }')
              if [ -z "${caches}" ]; then
                break
              fi
              deleted=0
              for cache in ${caches}; do
                gh actions-cache delete ${cache} -R $REPO -B ${BRANCH} --confirm && deleted=$((deleted + 1))
              done
              if [ "${deleted}" -eq 0 ]; then
                echo "Failed to delete any cache entry matching ${prefix}, stopping to avoid looping forever"
                break
              fi
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
