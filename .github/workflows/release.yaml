name: Release Tool

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step do you want to (re-)run?'
        required: true
        type: choice
        options:
          - 2-prepare-release
          - 4-post-release
          - 5-publish-helm
      version:
        description: 'Which version are you releasing? (e.g. vX.Y.Z[-(pre|rc).W])'
        required: true
        type: string
        default: vX.Y.Z

  workflow_call:
    inputs:
      step:
        description: 'Which step do you want to (re-)run?'
        required: true
        type: string
      version:
        description: 'Which version are you releasing? (e.g. vX.Y.Z[-(pre|rc).W])'
        required: true
        type: string
    secrets:
      CILIUM_RELEASE_BOT_PEM:
        required: true
      CILIUM_RELEASE_BOT_APP_ID:
        required: true
      # Unused since the Quay login below moved to OIDC, and kept only because
      # the stable branches still pass them to this workflow at @main, which
      # errors out when the secret is not declared here.
      QUAY_USERNAME_HELM_RELEASE_USERNAME:
        required: false
      QUAY_PASSWORD_HELM_RELEASE_PASSWORD:
        required: false

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}-${{ inputs.step }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    if: ${{ inputs.step != '5-publish-helm' }}
    environment:
      name: release-tool
      deployment: false
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.27.1

      - name: Get token
        id: get_token
        uses: cilium/actions-app-token@61a6271ce92ba02f49bf81c755685d59fb25a59a # v0.21.1
        with:
          APP_PEM: ${{ secrets.CILIUM_RELEASE_BOT_PEM }}
          APP_ID: ${{ secrets.CILIUM_RELEASE_BOT_APP_ID }}

      - name: Authenticate with GH CLI
        run: |
          gh auth login --with-token <<< "${{ steps.get_token.outputs.app_token }}"

      - name: Checkout release tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: cilium/release
          path: "./release"

      - name: Move release source code to upper directory
        run: mv release ../

      - name: Checkout cilium source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Build release tool
        shell: bash
        run: |
          cd ../release
          make

      - name: Set-up git
        run: |
          git config user.name "Cilium Release Bot"
          git config user.email "noreply@cilium.io"
          git remote set-url origin https://x-access-token:${{ steps.get_token.outputs.app_token }}@github.com/${{ github.repository }}.git

      - name: Run release tool
        shell: bash
        env:
          GITHUB_TOKEN: "${{ steps.get_token.outputs.app_token }}"
          ORG: "${{ github.repository_owner }}"
        run: |
          cd ../release
          ./release start \
            --force \
            --release-tool-dir "$(pwd)" \
            --charts-repo-dir "$(pwd)/../charts" \
            --repo-dir "$(pwd)/../cilium" \
            --repo ${{ github.repository }} \
            --target-version ${{ inputs.version }} \
            --steps ${{ inputs.step }} \
            --exclude-labels "cilium-cli-exclusive"

  release-helm:
    name: Release Helm
    if: ${{ inputs.step == '5-publish-helm' }}
    permissions:
      contents: read
      # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
      id-token: write
    environment:
      name: release-helm
      deployment: false
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.27.1

      - name: Install helm
        shell: bash
        run: |
          # We don't want renovate to update this version, because we want to
          # use a specific version of helm for the release tool to avoid
          # breaking the release process.
          HELM_VERSION=v3.18.5
          wget "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          sudo mv ./linux-amd64/helm /usr/local/bin

      - name: Get token
        id: get_token
        uses: cilium/actions-app-token@61a6271ce92ba02f49bf81c755685d59fb25a59a # v0.21.1
        with:
          APP_PEM: ${{ secrets.CILIUM_RELEASE_BOT_PEM }}
          APP_ID: ${{ secrets.CILIUM_RELEASE_BOT_APP_ID }}

      - name: Authenticate with GH CLI
        run: |
          gh auth login --with-token <<< "${{ steps.get_token.outputs.app_token }}"

      - name: Checkout release tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: cilium/release
          path: "./release"

      - name: Move release source code to upper directory
        run: mv release ../

      - name: Checkout helm chart
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: cilium/charts
          path: "./cilium-charts"

      - name: Set up charts repository git configuration
        shell: bash
        run: |
          mv cilium-charts ../charts
          cd ../charts
          git config user.name "Cilium Release Bot"
          git config user.email "noreply@cilium.io"
          git remote set-url origin https://x-access-token:${{ steps.get_token.outputs.app_token }}@github.com/cilium/charts.git
          git remote set-head origin --auto

      - name: Checkout cilium source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Build release tool
        shell: bash
        run: |
          cd ../release
          make

      - name: Set-up git
        run: |
          git config user.name "Cilium Release Bot"
          git config user.email "noreply@cilium.io"
          git remote set-url origin https://x-access-token:${{ steps.get_token.outputs.app_token }}@github.com/${{ github.repository }}.git

      # Quay's registry endpoint only accepts credentials or a JWT signed by
      # Quay itself, so the GitHub OIDC token cannot be used as the registry
      # password directly. Trade it for a short lived robot token first.
      #
      # Because the job references an environment, the subject of the token is
      # repo:cilium@21054566/cilium@48109239:environment:release-helm, the
      # immutable form that carries the owner and repository ids. That is the
      # identity federated with the robot account on the Quay side, so renaming
      # the environment breaks the login.
      - name: Get a quay.io robot token via OIDC
        id: registry-token
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_HELM }}
        run: |
          oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
            | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          # Pass the credentials on stdin so that the OIDC token is not visible
          # in the process list of the runner.
          robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
            | curl -sSf --retry 3 --retry-all-errors -K - \
              "https://quay.io/oauth2/federation/robot/token" \
            | jq -er '.token')"
          echo "::add-mask::${robot_token}"

          echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

      - name: Login to Helm registries
        shell: bash
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_HELM }}
          ROBOT_TOKEN: ${{ steps.registry-token.outputs.token }}
        run: |
          echo "Logging into Quay.io..."
          echo "${ROBOT_TOKEN}" | helm registry login quay.io --username "${ROBOT}" --password-stdin

      - name: Run release tool
        shell: bash
        env:
          GITHUB_TOKEN: "${{ steps.get_token.outputs.app_token }}"
          ORG: "${{ github.repository_owner }}"
        run: |
          cd ../release
          ./release start \
            --force \
            --release-tool-dir "$(pwd)" \
            --charts-repo-dir "$(pwd)/../charts" \
            --repo-dir "$(pwd)/../cilium" \
            --repo ${{ github.repository }} \
            --target-version ${{ inputs.version }} \
            --steps ${{ inputs.step }} \
            --exclude-labels "cilium-cli-exclusive"

      - name: Wait for helm chart PR checks and merge
        shell: bash
        env:
          GITHUB_TOKEN: "${{ steps.get_token.outputs.app_token }}"
          VERSION: ${{ inputs.version }}
        run: |
          echo "🔄 Waiting for helm chart PR checks and merging for version $VERSION"

          # Find the PR for this release
          BRANCH="pr/prepare-$VERSION"
          echo "Looking for PR from branch: $BRANCH"

          # Wait for PR to exist (in case it was just created)
          MAX_WAIT=300  # 5 minutes
          WAIT_TIME=0
          PR_NUMBER=""

          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            PR_NUMBER=$(gh pr list --repo cilium/charts --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -n "$PR_NUMBER" ]; then
              echo "Found PR #$PR_NUMBER"
              break
            fi
            echo "Waiting for PR to be created..."
            sleep 10
            WAIT_TIME=$((WAIT_TIME + 10))
          done

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ No PR found for branch $BRANCH after waiting $MAX_WAIT seconds"
            echo "Available PRs:"
            gh pr list --repo cilium/charts --state open || echo "Failed to list PRs"
            exit 1
          fi

          echo "Merging PR #$PR_NUMBER..."
          MERGE_ATTEMPTS=0
          MAX_MERGE_ATTEMPTS=3
          MERGE_SUCCESS=false

          while [ $MERGE_ATTEMPTS -lt $MAX_MERGE_ATTEMPTS ]; do
            MERGE_ATTEMPTS=$((MERGE_ATTEMPTS + 1))
            echo "🔄 Attempt $MERGE_ATTEMPTS of $MAX_MERGE_ATTEMPTS"

            # Wait for checks to complete
            echo "⏳ Waiting for PR checks to complete..."
            sleep 30  # Initial wait to allow checks to start
            if ! gh pr checks $PR_NUMBER --repo cilium/charts --fail-fast --required --watch; then
              echo "❌ PR #$PR_NUMBER has failed checks on attempt $MERGE_ATTEMPTS"
              echo "📋 Failed workflow details:"
              gh pr checks $PR_NUMBER --repo cilium/charts --json name,state,link | jq -r '.[] | select(.state == "FAILURE") | "  - \(.name): \(.state) (\(.link // "No URL"))"'
              if [ $MERGE_ATTEMPTS -lt $MAX_MERGE_ATTEMPTS ]; then
                echo "⚠️ Retrying..."
                continue
              else
                exit 1
              fi
            fi

            echo "✅ All required checks passed for PR #$PR_NUMBER"

            # Attempt to merge
            echo "Merging PR #$PR_NUMBER..."
            if gh pr merge $PR_NUMBER --repo cilium/charts --rebase --delete-branch; then
              echo "✅ Successfully merged PR #$PR_NUMBER"
              MERGE_SUCCESS=true
              break
            else
              echo "⚠️ Merge attempt $MERGE_ATTEMPTS failed"
              if [ $MERGE_ATTEMPTS -lt $MAX_MERGE_ATTEMPTS ]; then
                echo "🔄 Re-running release tool to update PR..."

                # Reset the charts directory by removing any files
                # This is a workaround due to left overs made by the generate_helm_release.sh script
                echo "🧹 Resetting ../charts directory..."
                cd ../charts
                git reset --hard "$(git symbolic-ref refs/remotes/origin/HEAD)"
                git clean -fdx
                cd -

                # Re-run the release tool (step from line 127)
                cd ../release
                ./release start \
                  --force \
                  --release-tool-dir "$(pwd)" \
                  --charts-repo-dir "$(pwd)/../charts" \
                  --repo-dir "$(pwd)/../cilium" \
                  --repo ${{ github.repository }} \
                  --target-version $VERSION \
                  --steps ${{ inputs.step }} \
                  --exclude-labels "cilium-cli-exclusive"
                cd -
              else
                echo "❌ Failed to merge PR #$PR_NUMBER after $MAX_MERGE_ATTEMPTS attempts"
                exit 1
              fi
            fi
          done

          if [ "$MERGE_SUCCESS" = false ]; then
            echo "❌ Failed to merge PR #$PR_NUMBER after $MAX_MERGE_ATTEMPTS attempts"
            exit 1
          fi

      - name: Get Helm Chart Digests
        id: helm_digests
        shell: bash
        run: |
          # Extract version without 'v' prefix for Helm chart tag
          VERSION="${{ inputs.version }}"
          CHART_VERSION="${VERSION#v}"

          # Read digests from the file created by release tool
          DIGEST_FILE="../release/helm-digests-${CHART_VERSION}.txt"

          if [ ! -f "$DIGEST_FILE" ]; then
            echo "❌ Digest file not found: $DIGEST_FILE"
            exit 1
          fi

          echo "⏳ Reading digests from $DIGEST_FILE"
          cat "$DIGEST_FILE"

          # Extract digest for quay.io
          QUAY_DIGEST=$(grep "quay.io/cilium" "$DIGEST_FILE" | awk '{print $2}')
          echo "quay_digest=${QUAY_DIGEST}" >> $GITHUB_OUTPUT
          echo "✅ Quay.io digest: ${QUAY_DIGEST}"

      # Waiting for the chart pull request to merge above takes tens of minutes,
      # which outlives the token minted for the helm login, so cosign gets one
      # of its own. The subject is the same as above.
      - name: Get a fresh quay.io robot token via OIDC
        id: signing-token
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_HELM }}
        run: |
          oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
            | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          # Pass the credentials on stdin so that the OIDC token is not visible
          # in the process list of the runner.
          robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
            | curl -sSf --retry 3 --retry-all-errors -K - \
              "https://quay.io/oauth2/federation/robot/token" \
            | jq -er '.token')"
          echo "::add-mask::${robot_token}"

          echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

      - name: Sign quay.io OCI helm chart
        uses: ./.github/actions/cosign
        with:
          image: "quay.io/${{ github.repository_owner }}/charts/cilium@${{ steps.helm_digests.outputs.quay_digest }}"
          generate_sbom: 'false'
          attach_sbom: 'false'
          registry_username: ${{ vars.QUAY_ROBOT_HELM }}
          registry_password: ${{ steps.signing-token.outputs.token }}
          registry_url: 'quay.io'
