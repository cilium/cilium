name: Cilium CLI tests

on:
  pull_request:
    paths-ignore:
      - 'Documentation/**'
      - 'test/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-cilium-cli-binaries:
    name: Build Cilium CLI binaries
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cleanup Disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          # renovate: datasource=golang-version depName=go
          go-version: 1.27.3

      # Load Golang cache build from GitHub
      - name: Load Golang cache build from GitHub
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: ${{ runner.temp }}/.cache/go
          key: ${{ runner.os }}-go-cilium-cli-cache-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-cilium-cli-cache-

      - name: Create cache directories if they don't exist
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/.cache/go/.cache/go-build"
          mkdir -p "${RUNNER_TEMP}/.cache/go/pkg"

      - name: Build Cilium CLI release binaries
        env:
          GOCACHE: "${{ runner.temp }}/.cache/go/.cache/go-build"
          GOMODCACHE: "${{ runner.temp }}/.cache/go/pkg"
        run: |
          make -C cilium-cli local-release
