name: Validate Renovate configuration

on:
  pull_request:
    paths:
      # Run on any renovate.json5, not just .github/renovate.json5
      - '**renovate.json5'

cache-mode: none

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # this step uses latest renovate slim release
      - name: Validate configuration
        run: |
          # renovate: datasource=docker
          export RENOVATE_IMAGE=ghcr.io/renovatebot/renovate:44.261.2@sha256:1022cef9c87acb3a6fb6c00dd112cbcac2c86a2928975bc8949b8d5e9aba56b1
          docker run --rm --entrypoint "renovate-config-validator" \
            -v "${{ github.workspace }}/.github/renovate.json5":"/renovate.json5" \
            ${RENOVATE_IMAGE} --strict "/renovate.json5"
