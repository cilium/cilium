name: GKE control-plane state
description: Prints what GKE did to a cluster's control plane, for a leg that failed
inputs:
  cluster:
    description: "Name of the GKE cluster."
    required: true
  zone:
    description: "Zone of the GKE cluster."
    required: true
runs:
  using: composite
  steps:
    - name: Print the cluster's status, operations and GKE audit log
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster }}
        ZONE: ${{ inputs.zone }}
      run: bash "${GITHUB_ACTION_PATH}/state.sh"
