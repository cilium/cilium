{{$TEST_NODE_NAME := .CL2_TEST_NODE_NAME}}

{{$NUM_FAKE_NODES := DefaultParam .CL2_NUM_FAKE_NODES 64}}
{{$FAKE_NODES_READY_TIMEOUT := DefaultParam .CL2_FAKE_NODES_READY_TIMEOUT "2m"}}

{{$CILIUM_NAMESPACE := DefaultParam .CL2_CILIUM_NAMESPACE "kube-system"}}
{{$CILIUM_CONFIGMAP_NAME := DefaultParam .CL2_CILIUM_CONFIGMAP_NAME "cilium-config"}}

{{$KWOK_DOCKER_IMAGE := DefaultParam .CL2_KWOK_DOCKER_IMAGE "docker.io/fristonio/kwok:cilium"}}
{{$KFUZZ_DOCKER_IMAGE := DefaultParam .CL2_KFUZZ_DOCKER_IMAGE "docker.io/fristonio/kfuzz:cilium"}}

{{$SCENARIO := DefaultParam .CL2_TEST_SCENARIO "test-scenario"}}
{{$TEST_DURATION_SECONDS := DefaultParam .CL2_TEST_DURATION_SECONDS 900}}

{{$KFUZZ_TICK_INTERVAL := DefaultParam .CL2_KFUZZ_TICK_INTERVAL "5s"}}
{{$KFUZZ_CLIENT_TUNING_SET := DefaultParam .CL2_KFUZZ_CLIENT_TUNING_SET "qps"}}
{{$KFUZZ_CLIENT_QPS := DefaultParam .CL2_KFUZZ_CLIENT_QPS 256}}
{{$KFUZZ_CLIENT_BURST_SIZE := DefaultParam .CL2_KFUZZ_CLIENT_BURST_SIZE 512}}
{{$KFUZZ_CLIENT_STEP_DELAY := DefaultParam .CL2_KFUZZ_CLIENT_STEP_DELAY "1s"}}
{{$KFUZZ_TERMINATION_GRACE_PERIOD_SECONDS := DefaultParam .CL2_KFUZZ_TERMINATION_GRACE_PERIOD_SECONDS 900}}
{{$KFUZZ_SKIP_RESOURCE_CLEANUP := DefaultParam .CL2_KFUZZ_SKIP_RESOURCE_CLEANUP false}}

{{$ENABLE_VIOLATIONS := DefaultParam .CL2_ENABLE_VIOLATIONS false}}

name: cilium-resource-churn
namespace:
  number: 0
tuningSets:
- name: Default
  globalQPSLoad:
    qps: 32
    burst: 64
- name: Sequential
  parallelismLimitedLoad:
    parallelismLimit: 1

steps:
- module:
    path: ./modules/kwok.yaml
    params:
      actionName: "create"
      tuningSet: Sequential
      image: {{$KWOK_DOCKER_IMAGE}}
      ciliumNamespace: {{$CILIUM_NAMESPACE}}
      ciliumConfigMapName: {{$CILIUM_CONFIGMAP_NAME}}

- name: Create fake nodes
  phases:
  - replicasPerNamespace: {{$NUM_FAKE_NODES}}
    tuningSet: Default
    objectBundle:
    - basename: fake-node
      objectTemplatePath: ./manifests/node.yaml

{{if gt $NUM_FAKE_NODES 0}}
- name: Waiting for fake nodes to be Ready
  measurements:
  - identifier: WaitForFakeNodesReady
    method: WaitForNodes
    params:
      labelSelector: "kfuzz.cilium.io/fake-node=true"
      minDesiredNodeCount: {{$NUM_FAKE_NODES}}
      maxDesiredNodeCount: {{$NUM_FAKE_NODES}}
      timeout: {{$FAKE_NODES_READY_TIMEOUT}}
{{end}}

- module:
    path: ./modules/metrics.yaml
    params:
      action: start
      testNodeName: {{$TEST_NODE_NAME}}
      enableViolations: {{$ENABLE_VIOLATIONS}}

- module:
    path: ../cilium-agent-pprofs.yaml
    params:
      action: start

# Runs the churn: the module returns once kfuzz has finished its run and its
# scaffolding is torn down again.
- module:
    path: ./modules/kfuzz.yaml
    params:
      tuningSet: Sequential
      image: {{$KFUZZ_DOCKER_IMAGE}}
      ciliumNamespace: {{$CILIUM_NAMESPACE}}
      testNodeName: {{$TEST_NODE_NAME}}
      scenario: {{$SCENARIO}}
      tickInterval: {{$KFUZZ_TICK_INTERVAL}}
      clientTuningSet: {{$KFUZZ_CLIENT_TUNING_SET}}
      clientQPS: {{$KFUZZ_CLIENT_QPS}}
      clientBurstSize: {{$KFUZZ_CLIENT_BURST_SIZE}}
      clientStepDelay: {{$KFUZZ_CLIENT_STEP_DELAY}}
      testDurationSeconds: {{$TEST_DURATION_SECONDS}}
      terminationGracePeriodSeconds: {{$KFUZZ_TERMINATION_GRACE_PERIOD_SECONDS}}
      skipResourceCleanup: {{$KFUZZ_SKIP_RESOURCE_CLEANUP}}

- module:
    path: ../cilium-agent-pprofs.yaml
    params:
      action: gather

- module:
    path: ./modules/metrics.yaml
    params:
      action: gather
      testNodeName: {{$TEST_NODE_NAME}}
      enableViolations: {{$ENABLE_VIOLATIONS}}

{{if not $KFUZZ_SKIP_RESOURCE_CLEANUP}}
- name: Delete fake nodes
  phases:
  - replicasPerNamespace: 0
    tuningSet: Sequential
    objectBundle:
    - basename: fake-node
      objectTemplatePath: ./manifests/node.yaml

- module:
    path: ./modules/kwok.yaml
    params:
      actionName: "delete"
      tuningSet: Sequential
      image: {{$KWOK_DOCKER_IMAGE}}
      ciliumNamespace: {{$CILIUM_NAMESPACE}}
      ciliumConfigMapName: {{$CILIUM_CONFIGMAP_NAME}}
{{end}}

