name: K8s on LVH
description: Creates K8s cluster inside LVH VM, and then exposes K8s cluster to GHA runner.

inputs:
  kernel:
    required: true
    description: 'Linux kernel version'
  kind-params:
    required: true
    description: 'Kind parameters'
  kind-image:
    required: true
    description: 'Kind image reference to pull on the runner host'
  external-target-image:
    required: true
    description: 'External-target image reference to pull on the runner host'
  auth-required:
    required: false
    description: 'Whether the runner host must authenticate before pulling images'
    default: 'false'
  login-host:
    required: false
    description: 'Registry host to authenticate to on the runner host'
    default: ''
  login-username:
    required: false
    description: 'Username for the host registry login'
    default: ''
  login-password:
    required: false
    description: 'Password or token for the host registry login'
    default: ''
  kind-config:
    required: false
    description: 'Optional Kind configuration'
  port-forward:
    required: false
    description: 'Optional list of ports to forward'
    default: '6443:6443'
  test-name:
    required: true
    description: 'Test name'
  dependency-list-sha:
    required: false
    description: 'Package cache key derived once per run by the lvh-cache-key job'
    default: ''

outputs:
  external_target_name:
    description: "Domain name of the first external target"
    value: ${{ steps.external_targets.outputs.external_target_name }}
  other_external_target_name:
    description: "Domain name of the second external target"
    value: ${{ steps.external_targets.outputs.other_external_target_name }}
  ipv4_external_cidr:
    description: "IPv4 CIDR in which the external targets are created"
    value: ${{ steps.external_network.outputs.ipv4_external_cidr }}
  ipv4_external_target:
    description: "IPv4 address of the first external target"
    value: ${{ steps.external_network.outputs.ipv4_external_target }}
  ipv4_other_external_target:
    description: "IPv4 address of the second external target"
    value: ${{ steps.external_network.outputs.ipv4_other_external_target }}
  ipv6_external_cidr:
    description: "IPv6 CIDR in which the external targets are created"
    value: ${{ steps.external_network.outputs.ipv6_external_cidr }}
  ipv6_external_target:
    description: "IPv6 address of the first external target"
    value: ${{ steps.external_network.outputs.ipv6_external_target }}
  ipv6_other_external_target:
    description: "IPv6 address of the second external target"
    value: ${{ steps.external_network.outputs.ipv6_other_external_target }}
  kind_network:
    description: "Name of the docker network created for kind"
    value: ${{ steps.external_network.outputs.kind_network }}

runs:
  using: composite
  steps:
    - name: Prepare images on runner host
      uses: ./.github/actions/prepare-lvh-images
      with:
        images: >-
          ${{ inputs.kind-image }}
          ${{ inputs.external-target-image }}
        login-host: ${{ inputs.login-host }}
        login-username: ${{ inputs.login-username }}
        login-password: ${{ inputs.login-password }}
        auth-required: ${{ inputs.auth-required }}

    - name: Provision LVH VMs
      uses: cilium/little-vm-helper@c8b0bfbae3bdda7bc69fb9cd370e4b74ce84986d # v0.0.33
      with:
        test-name: ${{ inputs.test-name }}
        image-version: ${{ inputs.kernel }}
        images-folder-parent: "/var/tmp"
        host-mount: ./
        cpu: 4
        mem: 12G
        # renovate: datasource=github-tags depName=cilium/little-vm-helper
        lvh-version: "v0.0.33"
        install-dependencies: 'true'
        dependency-list-sha: ${{ inputs.dependency-list-sha }}
        port-forward: ${{ inputs.port-forward }}
        ssh-connect-wait-retries: 600
        cmd: |
          git config --global --add safe.directory /host

    - name: Load prepared images inside LVH VM
      shell: bash
      env:
        IMAGES_DIR: ${{ runner.temp }}/lvh-images
        KIND_IMAGE: ${{ inputs.kind-image }}
        EXTERNAL_TARGET_IMAGE: ${{ inputs.external-target-image }}
      run: |
        set -euo pipefail

        KIND_IMAGE=$(jq -er --arg image "$KIND_IMAGE" '.[$image]' "$IMAGES_DIR/image-map.json")
        EXTERNAL_TARGET_IMAGE=$(jq -er --arg image "$EXTERNAL_TARGET_IMAGE" '.[$image]' "$IMAGES_DIR/image-map.json")

        ssh_args=(-p 2222 -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o ForwardAgent=no)
        # Only image data crosses into the untrusted VM, never registry credentials.
        ssh "${ssh_args[@]}" root@localhost 'docker image load' < "$IMAGES_DIR/images.tar"
        # Fail before cluster setup if either exported image was not loaded.
        printf -v inspect_command 'docker image inspect %q %q > /dev/null' "$KIND_IMAGE" "$EXTERNAL_TARGET_IMAGE"
        printf '%s\n' "$inspect_command" |
          ssh "${ssh_args[@]}" root@localhost 'bash -se'

        # Make the resolved tags available to the cluster and target steps.
        printf 'LVH_KIND_IMAGE=%s\nLVH_EXTERNAL_TARGET_IMAGE=%s\n' \
          "$KIND_IMAGE" "$EXTERNAL_TARGET_IMAGE" >> "$GITHUB_ENV"

    - name: Add external docker network
      uses: ./.github/actions/kind-external-network
      id: external_network
      with:
        lvh: 'true'

    - name: Create K8s cluster
      uses: cilium/little-vm-helper@c8b0bfbae3bdda7bc69fb9cd370e4b74ce84986d # v0.0.33
      with:
        provision: 'false'
        cmd: |
          cd /host
          export IMAGE=${{ env.LVH_KIND_IMAGE }}

          # These commands are passed to stdin of ssh as a here-document. Env
          # vars used here are substituted by bash from GitHub's env. However,
          # in order to include them into the enviroment of kind.sh called
          # below, they also need to be set inside the ssh session.
          export KIND_EXPERIMENTAL_DOCKER_NETWORK=${KIND_EXPERIMENTAL_DOCKER_NETWORK@Q}

          if [ "${{ inputs.kind-config }}" != "" ]; then
            kind create cluster --config ${{ inputs.kind-config }} --image ${{ env.LVH_KIND_IMAGE }}
          else
            ./contrib/scripts/kind.sh ${{ inputs.kind-params }} 0.0.0.0 6443
          fi

    - name: Copy kubeconfig
      shell: bash
      run: |
        mkdir ~/.kube
        scp -o StrictHostKeyChecking=no -P 2222 root@localhost:/root/.kube/config ~/.kube/config

    - name: Add external targets to kind cluster
      uses: ./.github/actions/kind-external-targets
      id: external_targets
      env:
        KIND_FAKE_EXTERNAL_TARGET_IMAGE: ${{ env.LVH_EXTERNAL_TARGET_IMAGE }}
      with:
        lvh: 'true'
        kind_network: ${{ steps.external_network.outputs.kind_network }}
        ipv4_external_target: ${{ steps.external_network.outputs.ipv4_external_target }}
        ipv4_other_external_target: ${{ steps.external_network.outputs.ipv4_other_external_target }}
        ipv6_external_target: ${{ steps.external_network.outputs.ipv6_external_target }}
        ipv6_other_external_target: ${{ steps.external_network.outputs.ipv6_other_external_target }}
