name: Create an AKS cluster
description: Create an AKS cluster
inputs:
  cluster_name:
    description: ''
    required: true
  location:
    description: ''
    required: true
  version:
    description: ''
    required: false
    default: ''
  node_count:
    description: ''
    required: false
    default: 2
  tags:
    description: ''
    required: false
    default: ''
  taints:
    description: ''
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Get runner public IP
      id: get-runner-ip
      uses: ./.github/actions/get-runner-ip
      with:
        source: https://checkip.amazonaws.com
        parsing: text

    - name: Create AKS cluster
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster_name }}
        LOCATION: ${{ inputs.location }}
        K8S_VERSION: ${{ inputs.version }}
        NODE_COUNT: ${{ inputs.node_count }}
        TAGS: ${{ inputs.tags }}
        TAINTS: ${{ inputs.taints }}
        AUTHORIZED_IP_RANGES: ${{ steps.get-runner-ip.outputs.cidr }}
      run: bash "${{ github.action_path }}/action.sh"
