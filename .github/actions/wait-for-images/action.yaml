name: Wait for images
description: Wait for images
inputs:
  SHA:
    description: 'inputs.sha'
    required: true
    default: 'incorrect-sha'
  images:
    description: 'list of images to wait for'
    required: false
    default: 'cilium-ci operator-generic-ci hubble-relay-ci cilium-cli-ci'
  login-host:
    description: 'The host to login to if login is set to true.'
    required: false
    default: ''
  login-username:
    description: 'The username to login to the registry if login is set to true.'
    required: false
    default: ''
  login-password:
    description: 'The password to login to the registry if login is set to true.'
    required: false
    default: ''
  auth-required:
    description: 'Variable setting up if auth is required or not. Can be found in the repository variable under DOCKER_AUTH_REQUIRED name'
    required: false
    default: 'true'
  timeout-minutes:
    description: 'Give up waiting after this many minutes. Keep it below the job timeout so the error message is the informative one.'
    required: false
    default: '25'
runs:
  using: composite
  steps:
    - name: Set environment variables
      uses: ./.github/actions/set-env-variables
    - name: Login to docker registry
      if: ${{ inputs.auth-required == 'true' && inputs.login-host != '' && inputs.login-username != '' && inputs.login-password != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.login-host }}
        username: ${{ inputs.login-username }}
        password: ${{ inputs.login-password }}
    - name: Wait for images
      shell: bash
      env:
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        images=( ${{ inputs.images }} )
        if [[ ! -d cilium-cli ]]; then
            >&2 echo "Skipping cilium-cli-ci due to lack of local directory"
            images=( "${images[@]/cilium-cli-ci}" )
        fi
        deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
        for image in ${images[@]}; do
          ref="${{ env.REGISTRY_DEV }}/${{ env.ORGANIZATION_DEV }}/$image:${{ inputs.SHA }}"
          until docker manifest inspect "${ref}" &> /dev/null
          do
            if (( $(date +%s) >= deadline )); then
              echo "::error::Timed out after ${TIMEOUT_MINUTES} minutes waiting for ${ref}"
              exit 1
            fi
            echo "Waiting for ${ref} image to become available..."
            sleep 45s
          done
        done
