name: Get Runner IP
description: Fetch the runner public IP from a source and return it as an output.
inputs:
  source:
    description: One or more URLs, separated by spaces, to fetch the runner public IP from, tried in order.
    required: true
  parsing:
    description: Parsing mode for the fetched response. Supported values are 'text' and 'json'.
    required: false
    default: text
  json-key:
    description: Optional JSON key (dot-separated) to extract the IP from when parsing is 'json'. If not set, common keys are tried.
    required: false
outputs:
  ip:
    description: The parsed and validated runner public IP address.
    value: ${{ steps.get-ip.outputs.ip }}
  mask:
    description: The parsed and validated runner public IP mask.
    value: ${{ steps.get-ip.outputs.mask }}
  cidr:
    description: The parsed and validated runner public IP in CIDR notation.
    value: ${{ steps.get-ip.outputs.cidr }}
runs:
  using: composite
  steps:
    - name: Get runner public IP
      id: get-ip
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const sources = `${{ inputs.source }}`.trim().split(/\s+/).filter(Boolean);
          const parsing = `${{ inputs.parsing }}`.trim().toLowerCase();
          const jsonKey = `${{ inputs['json-key'] }}`.trim();
          const net = require('node:net');
          if (sources.length === 0) {
            core.setFailed("Input 'source' must list at least one URL");
            return;
          }
          if (parsing !== 'text' && parsing !== 'json') {
            core.setFailed(`Unsupported parsing mode '${parsing}'. Use 'text' or 'json'.`);
            return;
          }
          const isLikelyIp = (value) => {
            if (typeof value !== 'string') return false;
            const v = value.trim();
            if (!v) return false;
            return net.isIP(v) !== 0;
          };
          const getByDotPath = (obj, path) => {
            if (!path) return undefined;
            return path.split('.').reduce((acc, key) => (acc && typeof acc === 'object' ? acc[key] : undefined), obj);
          };
          const timeoutMs = 10000;
          // Returns the IP that source reports, or throws.
          const lookup = async (source) => {
            const controller = new AbortController();
            const timeout = setTimeout(() => {
              controller.abort(new Error(`Request timed out after ${timeoutMs}ms`));
            }, timeoutMs);
            let rawText;
            try {
              const response = await fetch(source, {
                signal: controller.signal,
                headers: {
                  'User-Agent': 'actions/github-script get-runner-ip',
                  'Accept': parsing === 'json' ? 'application/json,*/*' : '*/*',
                },
              });
              if (!response.ok) {
                const body = await response.text().catch(() => '');
                throw new Error(`HTTP ${response.status} ${response.statusText}${body ? `; body: ${body.slice(0, 200)}` : ''}`);
              }
              rawText = await response.text();
            } catch (e) {
              throw new Error(`${e?.message || e}${e?.cause?.message ? ` (${e.cause.message})` : ''}`);
            } finally {
              clearTimeout(timeout);
            }
            const trimmed = (rawText || '').trim();
            let ip;
            if (parsing === 'text') {
              ip = trimmed;
            } else {
              let data;
              try {
                data = JSON.parse(trimmed);
              } catch (e) {
                throw new Error(`Failed to parse JSON: ${e?.message || e}; body starts with: ${trimmed.slice(0, 200)}`);
              }
              const candidates = [];
              if (jsonKey) {
                candidates.push(getByDotPath(data, jsonKey));
              }
              // Common response shapes from IP endpoints
              candidates.push(data?.ip);
              candidates.push(data?.origin);
              candidates.push(data?.query);
              candidates.push(data?.address);
              candidates.push(data?.data?.ip);
              candidates.push(data?.data?.address);
              ip = candidates.find((c) => typeof c === 'string' && c.trim().length > 0);
              if (typeof ip === 'string') {
                ip = ip.trim();
              }
            }
            if (!ip || typeof ip !== 'string') {
              throw new Error('No IP address found in the response');
            }
            if (!isLikelyIp(ip)) {
              throw new Error(`Parsed value is not a valid IP address: '${ip}'`);
            }
            return ip;
          };
          // One 10s attempt per source, in order.
          const errors = [];
          let ip;
          for (const source of sources) {
            try {
              ip = await lookup(source);
              break;
            } catch (e) {
              errors.push(`'${source}': ${e.message}`);
              if (errors.length < sources.length) {
                core.warning(`Fetch '${source}' failed: ${e.message}; trying the next source`);
              }
            }
          }
          if (!ip) {
            core.setFailed(`Failed to fetch the runner IP from every source: ${errors.join('; ')}`);
            return;
          }
          core.setOutput('ip', ip);
          const mask = net.isIPv6(ip) ? "128" : "32";
          core.setOutput('mask', mask);
          core.setOutput('cidr', `${ip}/${mask}`);
