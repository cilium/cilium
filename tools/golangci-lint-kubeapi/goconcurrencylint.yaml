version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
  timeout: 60m

linters:
  default: none
  enable:
    - goconcurrencylint

  settings:
    custom:
      goconcurrencylint:
        type: module
        description: Detects misuse of sync.Mutex, sync.RWMutex, sync.WaitGroup, sync.Once, sync.Cond, sync.Pool and channels
        settings:
          # GCL5001 (non-pointer value in a sync.Pool) is the same check as
          # staticcheck's SA6002, which is already enabled in .golangci.yaml.
          checks:
            - all
            - -GCL5001
