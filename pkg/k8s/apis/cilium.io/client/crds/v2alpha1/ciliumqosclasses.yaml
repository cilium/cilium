---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ciliumqosclasses.cilium.io
spec:
  group: cilium.io
  names:
    categories:
    - cilium
    - ciliumqos
    kind: CiliumQoSClass
    listKind: CiliumQoSClassList
    plural: ciliumqosclasses
    shortNames:
    - cqc
    singular: ciliumqosclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mechanismRef.name
      name: Mechanism
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CiliumQoSClass is a reusable QoS profile built on top of a declared
          CiliumQoSMechanism. It is owned by the infrastructure admin, who translates
          the site's traffic classes ("voice", "guaranteed", ...) into concrete
          mechanism parameters that application developers can then reference by name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              mechanismRef:
                description: MechanismRef selects the CiliumQoSMechanism this class
                  configures.
                properties:
                  name:
                    description: Name of the CiliumQoSMechanism.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              parameters:
                description: |-
                  Parameters configures the referenced mechanism. Exactly one of its
                  fields must be set, and it has to be the one matching the type of the
                  referenced mechanism.
                properties:
                  dscp:
                    description: DSCP configures a class backed by a mechanism of
                      type DSCP.
                    properties:
                      value:
                        description: |-
                          Value is the DSCP codepoint written into matching packets. The whole
                          0-63 range is accepted: how it is divided up is a property of the
                          network the cluster runs in, not of Cilium.
                        maximum: 63
                        minimum: 0
                        type: integer
                    required:
                    - value
                    type: object
                  nodePriority:
                    description: |-
                      NodePriority configures a class backed by a mechanism of type
                      NodePriority.
                    properties:
                      priority:
                        description: |-
                          Priority is the scheduling class matching packets are put in on the
                          node they egress from.
                        enum:
                        - Guaranteed
                        - Burstable
                        - BestEffort
                        type: string
                    required:
                    - priority
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of dscp or nodePriority must be set
                  rule: '[has(self.dscp), has(self.nodePriority)].exists_one(x, x)'
              priority:
                default: 0
                description: |-
                  Priority breaks ties between classes that are selected for the same
                  flow by equally specific rules. The higher number wins.

                  Priority is mechanism-local: it only orders classes that share the
                  same underlying mechanism, and never arbitrates between mechanisms
                  that are applied concurrently.
                format: int32
                maximum: 65535
                minimum: 0
                type: integer
            required:
            - mechanismRef
            - parameters
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions report whether the class resolves to a declared and
                  supported mechanism.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
