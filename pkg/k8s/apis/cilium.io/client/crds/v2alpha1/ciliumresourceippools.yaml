---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ciliumresourceippools.cilium.io
spec:
  group: cilium.io
  names:
    categories:
    - cilium
    kind: CiliumResourceIPPool
    listKind: CiliumResourceIPPoolList
    plural: ciliumresourceippools
    shortNames:
    - crip
    singular: ciliumresourceippool
  scope: Cluster
  versions:
  - name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CiliumResourceIPPool defines an IP pool that can be used for Multi-Pool
          Resource IPAM by the Cilium Network Driver.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowFirstIP:
                default: false
                description: |-
                  AllowFirstIP allows the first IP of each delegated CIDR to be used. If
                  unset or false, this IP is reserved. This field is ignored for /{31,32}
                  and /{127,128} CIDRs since reserving the first and last IPs would make
                  the CIDRs unusable. This field is immutable.
                type: boolean
                x-kubernetes-validations:
                - message: allowFirstIP is immutable
                  rule: self == oldSelf
              allowLastIP:
                default: false
                description: |-
                  AllowLastIP allows the last IP of each delegated CIDR to be used. If
                  unset or false, this IP is reserved. This field is ignored for /{31,32}
                  and /{127,128} CIDRs since reserving the first and last IPs would make
                  the CIDRs unusable. This field is immutable.
                type: boolean
                x-kubernetes-validations:
                - message: allowLastIP is immutable
                  rule: self == oldSelf
              ipv4:
                description: IPv4 specifies the IPv4 CIDRs and mask sizes of the pool
                properties:
                  cidrs:
                    description: CIDRs is a list of IPv4 CIDRs that are part of the
                      pool.
                    items:
                      format: cidr
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                  maskSize:
                    description: MaskSize is the mask size of the pool.
                    maximum: 32
                    minimum: 1
                    type: integer
                    x-kubernetes-validations:
                    - message: maskSize is immutable
                      rule: self == oldSelf
                  pool:
                    description: |-
                      Pool contains per-CIDR configuration for a subset of CIDRs listed in CIDRs.
                      Each entry must reference a CIDR in CIDRs.
                    items:
                      properties:
                        cidr:
                          description: CIDR references one of the CIDRs listed in
                            the parent pool spec.
                          format: cidr
                          type: string
                        reservedRanges:
                          description: ReservedRanges is a list of IP ranges within
                            CIDR that must not be allocated.
                          items:
                            properties:
                              end:
                                description: The last IP in the reserved range.
                                type: string
                              start:
                                description: The first IP in the reserved range.
                                type: string
                            required:
                            - end
                            - start
                            type: object
                          type: array
                      required:
                      - cidr
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - cidr
                    x-kubernetes-list-type: map
                required:
                - cidrs
                - maskSize
                type: object
                x-kubernetes-validations:
                - message: If pool is set, each pool entry must reference a CIDR from
                    cidrs
                  rule: '!has(self.pool) || self.pool.all(p, p.cidr in self.cidrs)'
              ipv6:
                description: IPv6 specifies the IPv6 CIDRs and mask sizes of the pool
                properties:
                  cidrs:
                    description: CIDRs is a list of IPv6 CIDRs that are part of the
                      pool.
                    items:
                      format: cidr
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                  maskSize:
                    description: MaskSize is the mask size of the pool.
                    maximum: 128
                    minimum: 1
                    type: integer
                    x-kubernetes-validations:
                    - message: maskSize is immutable
                      rule: self == oldSelf
                  pool:
                    description: |-
                      Pool contains per-CIDR configuration for a subset of CIDRs listed in CIDRs.
                      Each entry must reference a CIDR in CIDRs.
                    items:
                      properties:
                        cidr:
                          description: CIDR references one of the CIDRs listed in
                            the parent pool spec.
                          format: cidr
                          type: string
                        reservedRanges:
                          description: ReservedRanges is a list of IP ranges within
                            CIDR that must not be allocated.
                          items:
                            properties:
                              end:
                                description: The last IP in the reserved range.
                                type: string
                              start:
                                description: The first IP in the reserved range.
                                type: string
                            required:
                            - end
                            - start
                            type: object
                          type: array
                      required:
                      - cidr
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - cidr
                    x-kubernetes-list-type: map
                required:
                - cidrs
                - maskSize
                type: object
                x-kubernetes-validations:
                - message: If pool is set, each pool entry must reference a CIDR from
                    cidrs
                  rule: '!has(self.pool) || self.pool.all(p, p.cidr in self.cidrs)'
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
