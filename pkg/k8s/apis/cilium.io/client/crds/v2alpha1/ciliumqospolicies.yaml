kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ciliumqospolicies.cilium.io
spec:
  group: cilium.io
  names:
    categories:
    - cilium
    - ciliumqos
    kind: CiliumQoSPolicy
    listKind: CiliumQoSPolicyList
    plural: ciliumqospolicies
    shortNames:
    - cqp
    singular: ciliumqospolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CiliumQoSPolicy applies QoS classes to the egress traffic of the pods it
          selects. It is owned by the application developer, who picks from the
          classes the infrastructure admin has published.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              egress:
                description: |-
                  Egress is the list of rules applied to traffic leaving the selected
                  pods.
                items:
                  description: |-
                    QoSEgressRule assigns QoS classes to the subset of egress traffic it
                    matches. A rule with neither ToCIDR nor ToPorts matches all egress traffic
                    of the selected pods.
                  properties:
                    fromPorts:
                      description: |-
                        FromPorts matches traffic by the source port it leaves the selected pod
                        with. If set, a packet has to match one of the entries for the rule to
                        apply.
                      items:
                        description: QoSPortRule is a set of ports and protocols matched
                          by a QoSEgressRule.
                        properties:
                          ports:
                            description: Ports is the list of port and protocol pairs
                              to match on.
                            items:
                              description: |-
                                QoSPortProtocol is a single L4 port, or contiguous port range, together with
                                the protocol it is matched on.
                              properties:
                                endPort:
                                  description: |-
                                    EndPort makes the entry match the range [Port, EndPort]. It has to be
                                    greater than or equal to Port.
                                  format: int32
                                  maximum: 65535
                                  minimum: 0
                                  type: integer
                                port:
                                  description: |-
                                    Port is an L4 port number. Named ports are not supported: QoS is
                                    resolved without knowledge of the container that terminates the flow.
                                  pattern: ^(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[0-9]{1,4})$
                                  type: string
                                protocol:
                                  description: |-
                                    Protocol is the L4 protocol. If "ANY", omitted or empty, TCP, UDP and
                                    SCTP all match.
                                  enum:
                                  - TCP
                                  - UDP
                                  - SCTP
                                  - ANY
                                  type: string
                              required:
                              - port
                              type: object
                            maxItems: 40
                            minItems: 1
                            type: array
                        required:
                        - ports
                        type: object
                      maxItems: 40
                      type: array
                    qosClassRefs:
                      description: |-
                        QoSClassRefs are the classes applied to the matching traffic. At most
                        one class per mechanism may take effect for a given packet; conflicts
                        between rules of equal specificity are resolved by class priority.
                      items:
                        description: QoSClassReference references a cluster-scoped
                          CiliumQoSClass by name.
                        properties:
                          name:
                            description: Name of the CiliumQoSClass.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      maxItems: 8
                      minItems: 1
                      type: array
                    toCIDR:
                      description: |-
                        ToCIDR matches traffic by destination address. If set, a packet has to
                        fall into one of the prefixes for the rule to apply.
                      items:
                        format: cidr
                        type: string
                      maxItems: 64
                      type: array
                    toPorts:
                      description: |-
                        ToPorts matches traffic by destination port and protocol. If set, a
                        packet has to match one of the entries for the rule to apply.
                      items:
                        description: QoSPortRule is a set of ports and protocols matched
                          by a QoSEgressRule.
                        properties:
                          ports:
                            description: Ports is the list of port and protocol pairs
                              to match on.
                            items:
                              description: |-
                                QoSPortProtocol is a single L4 port, or contiguous port range, together with
                                the protocol it is matched on.
                              properties:
                                endPort:
                                  description: |-
                                    EndPort makes the entry match the range [Port, EndPort]. It has to be
                                    greater than or equal to Port.
                                  format: int32
                                  maximum: 65535
                                  minimum: 0
                                  type: integer
                                port:
                                  description: |-
                                    Port is an L4 port number. Named ports are not supported: QoS is
                                    resolved without knowledge of the container that terminates the flow.
                                  pattern: ^(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[0-9]{1,4})$
                                  type: string
                                protocol:
                                  description: |-
                                    Protocol is the L4 protocol. If "ANY", omitted or empty, TCP, UDP and
                                    SCTP all match.
                                  enum:
                                  - TCP
                                  - UDP
                                  - SCTP
                                  - ANY
                                  type: string
                              required:
                              - port
                              type: object
                            maxItems: 40
                            minItems: 1
                            type: array
                        required:
                        - ports
                        type: object
                      maxItems: 40
                      type: array
                  required:
                  - qosClassRefs
                  type: object
                minItems: 1
                type: array
              podSelector:
                description: |-
                  PodSelector selects the pods, within the namespace of the policy, whose
                  egress traffic the rules apply to. An empty selector selects every pod
                  in the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      description: MatchLabelsValue represents the value from the
                        MatchLabels {key,value} pair.
                      maxLength: 63
                      pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - egress
            - podSelector
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions report whether the policy resolves to existing classes and
                  has been realized.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
