                      format: cidr
                      pattern: ^[^:]+$
                      type: string
                    prefixLength:
                      description: |-
                        PrefixLength is the prefix length associated to the allocated IPv4 addresses. If it is
                        omitted, the prefix length of the CIDR is applied instead.
                      maximum: 32
                      minimum: 1
                      type: integer
                    routes:
                      description: Routes lists the routes that are added when configuring
                        the network resource.
                      items:
                        properties:
                          destination:
