                      format: cidr
                      pattern: ':'
                      type: string
                    prefixLength:
                      description: |-
                        PrefixLength is the prefix length associated to the allocated IPv4 addresses. If it is
                        omitted, the prefix length of the CIDR is applied instead.
                      maximum: 128
                      minimum: 1
