                              as an IPv4 CIDR.
                            format: cidr
                            pattern: ^[^:]+$
                            type: string
                          gateway:
                            description: Gateway specifies the route gateway address.
                            format: ipv4
                            pattern: ^[^:]+$
                            type: string
                        required:
                        - destination
                        - gateway
                        type: object
                      minItems: 1
                      type: array
