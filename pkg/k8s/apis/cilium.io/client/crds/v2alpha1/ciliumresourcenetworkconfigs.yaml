kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ciliumresourcenetworkconfigs.cilium.io
spec:
  group: cilium.io
  names:
    categories:
    - cilium
    kind: CiliumResourceNetworkConfig
    listKind: CiliumResourceNetworkConfigList
    plural: ciliumresourcenetworkconfigs
    shortNames:
    - crnc
    singular: ciliumresourcenetworkconfig
  scope: Cluster
  versions:
  - name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CiliumResourceNetworkConfig defines the network parameters to configure a network resource
          claimed from a workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              ipv4:
                description: |-
                  IPv4 specifies the list of IPv4 network configurations, with at most one entry per CIDR.
                  For an allocated IPv4 address, the entry whose CIDR contains it is selected, using
                  longest-prefix matching if several do. If no entry contains the address, the prefix length of
                  the CiliumResourceIPPool CIDR containing it is applied and no routes are added.
                items:
                  properties:
                    cidr:
                      description: |-
                        CIDR is the IPv4 CIDR the network configuration applies to. It must be a network address,
                        with no host bits set (e.g.: 10.0.0.0/16).

                        MaxLength bounds the string length of the value (not the CIDR prefix length).
                      maxLength: 18
                      type: string
                      x-kubernetes-validations:
                      - message: 'must be an IPv4 network address in CIDR notation
                          with no host bits set (e.g.: 10.0.0.0/16)'
                        rule: isCIDR(self) && cidr(self).ip().family() == 4 && string(cidr(self).masked())
                          == self
                    prefixLength:
                      description: |-
                        PrefixLength is the prefix length associated to the allocated IPv4 addresses. If it is
                        omitted, the prefix length of the CIDR is applied instead.
                      maximum: 32
                      minimum: 1
                      type: integer
                    routes:
                      description: |-
                        Routes lists the routes that are added when configuring the network resource, with at most
                        one route per destination.
                      items:
                        properties:
                          destination:
                            description: |-
                              Destination specifies the route destination, as an IPv4 CIDR. It must be a network address,
                              with no host bits set (e.g.: 192.168.1.0/24).

                              MaxLength bounds the string length of the value (not the CIDR prefix length).
                            maxLength: 18
                            type: string
                            x-kubernetes-validations:
                            - message: 'must be an IPv4 network address in CIDR notation
                                with no host bits set (e.g.: 192.168.1.0/24)'
                              rule: isCIDR(self) && cidr(self).ip().family() == 4
                                && string(cidr(self).masked()) == self
                          gateway:
                            description: |-
                              Gateway specifies the route gateway address. If it is omitted, the route is a direct route.

                              MaxLength bounds the string length of the value.
                            maxLength: 15
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid IPv4 address in dotted-decimal
                                notation, without leading zeros
                              rule: isIP(self) && ip(self).family() == 4
                        required:
                        - destination
                        type: object
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - destination
                      x-kubernetes-list-type: map
                  required:
                  - cidr
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - cidr
                x-kubernetes-list-type: map
              ipv6:
                description: |-
                  IPv6 specifies the list of IPv6 network configurations, with at most one entry per CIDR.
                  For an allocated IPv6 address, the entry whose CIDR contains it is selected, using
                  longest-prefix matching if several do. If no entry contains the address, the prefix length of
                  the CiliumResourceIPPool CIDR containing it is applied and no routes are added.
                items:
                  properties:
                    cidr:
                      description: |-
                        CIDR is the IPv6 CIDR the network configuration applies to. It must be a network address
                        in canonical form (lowercase, compressed, with no host bits set; e.g.: fd00::/48).

                        MaxLength bounds the string length of the value (not the CIDR prefix length).
                      maxLength: 43
                      type: string
                      x-kubernetes-validations:
                      - message: 'must be an IPv6 network address in canonical CIDR
                          notation (lowercase, compressed, no host bits set; e.g.:
                          fd00::/48)'
                        rule: isCIDR(self) && cidr(self).ip().family() == 6 && string(cidr(self).masked())
                          == self
                    prefixLength:
                      description: |-
                        PrefixLength is the prefix length associated to the allocated IPv6 addresses. If it is
                        omitted, the prefix length of the CIDR is applied instead.
                      maximum: 128
                      minimum: 1
                      type: integer
                    routes:
                      description: |-
                        Routes lists the routes that are added when configuring the network resource, with at most
                        one route per destination.
                      items:
                        properties:
                          destination:
                            description: |-
                              Destination specifies the route destination, as an IPv6 CIDR. It must be a network address
                              in canonical form (lowercase, compressed, with no host bits set; e.g.: fd01::/64).

                              MaxLength bounds the string length of the value (not the CIDR prefix length).
                            maxLength: 43
                            type: string
                            x-kubernetes-validations:
                            - message: 'must be an IPv6 network address in canonical
                                CIDR notation (lowercase, compressed, no host bits
                                set; e.g.: fd01::/64)'
                              rule: isCIDR(self) && cidr(self).ip().family() == 6
                                && string(cidr(self).masked()) == self
                          gateway:
                            description: |-
                              Gateway specifies the route gateway address. If it is omitted, the route is a direct route.

                              MaxLength bounds the string length of the value.
                            maxLength: 45
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid IPv6 address (IPv4-mapped addresses
                                are not allowed)
                              rule: isIP(self) && ip(self).family() == 6
                        required:
                        - destination
                        type: object
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - destination
                      x-kubernetes-list-type: map
                  required:
                  - cidr
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - cidr
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
